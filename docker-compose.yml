version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ether_postgres
    environment:
      POSTGRES_DB: ether_simulation
      POSTGRES_USER: ether
      POSTGRES_PASSWORD: dev_password
    ports:
      - "54320:5432"  # Host:Container (using non-standard port to avoid conflicts)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ether"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ether_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
