<svg xmlns="http://www.w3.org/2001/XMLSchema-instance" viewBox="0 0 1024 512" width="1024" height="512">
  <g id="sovereignty_layer" data-layer="SOVEREIGNTY">
    <!-- Empire of Mali under Mansa Musa (1324 AD) -->
    <path id="polity_mali_empire" fill="#F59E0B" data-density="0.80" d="M 460 216 L 555 216 L 555 255 L 460 255 Z" />
  </g>

  <g id="isogloss_layer" data-layer="ISOGLOSS">
    <!-- Manding / Mande Language Family -->
    <path id="isogloss_mande" fill="#F59E0B" d="M 460 216 L 555 216 L 555 255 L 460 255 Z" />
  </g>

  <g id="kinship_layer" data-layer="KINSHIP">
    <!-- Keita Lineage & Guild Clan System (Nyamakala) -->
    <path id="kinship_keita_lineage" fill="#D97706" d="M 460 216 L 555 216 L 555 255 L 460 255 Z" />
  </g>

  <g id="rituals_layer" data-layer="RITUALS">
    <!-- Djinguereber Mosque & Sankore University (Timbuktu) -->
    <circle id="ritual_timbuktu" cx="503" cy="207" r="22" fill="#F59E0B" />
    <!-- Great Mosque of Djenné -->
    <circle id="ritual_djenne" cx="499" cy="216" r="20" fill="#D97706" />
  </g>

  <g id="density_layer" data-layer="DENSITY">
    <!-- Niger River Delta / Timbuktu-Djenné Urban Axis -->
    <circle id="density_timbuktu" cx="503" cy="207" r="25" fill="#FFFFFF" data-density="0.9" />
  </g>
</svg>
