<svg xmlns="http://www.w3.org/2001/XMLSchema-instance" viewBox="0 0 1024 512" width="1024" height="512">
  <g id="sovereignty_layer" data-layer="SOVEREIGNTY">
    <!-- Song Dynasty China (1000 AD) -->
    <path id="polity_song_dynasty" fill="#EF4444" data-density="0.90" d="M 790 136 L 870 136 L 870 205 L 790 205 Z" />
    <!-- Liao Dynasty (Khitan Empire) -->
    <path id="polity_liao_dynasty" fill="#3B82F6" data-density="0.65" d="M 790 100 L 870 100 L 870 136 L 790 136 Z" />
  </g>

  <g id="isogloss_layer" data-layer="ISOGLOSS">
    <!-- Middle Chinese Dialect Continuum -->
    <path id="isogloss_middle_chinese" fill="#EF4444" d="M 790 136 L 870 136 L 870 205 L 790 205 Z" />
  </g>

  <g id="kinship_layer" data-layer="KINSHIP">
    <!-- Neo-Confucian Clan Lineage Registers (Zupu) -->
    <path id="kinship_confucian_lineage" fill="#B91C1C" d="M 790 136 L 870 136 L 870 205 L 790 205 Z" />
  </g>

  <g id="rituals_layer" data-layer="RITUALS">
    <!-- Kaifeng Capital & Imperial Ancestral Shrines -->
    <circle id="ritual_kaifeng" cx="810" cy="156" r="22" fill="#EF4444" />
    <!-- Hangzhou (Lin'an) Southern Cultural Center -->
    <circle id="ritual_hangzhou" cx="826" cy="170" r="20" fill="#F59E0B" />
  </g>

  <g id="density_layer" data-layer="DENSITY">
    <!-- Kaifeng Mega-Urban Core (World's Largest City ~1000 AD) -->
    <circle id="density_kaifeng" cx="810" cy="156" r="28" fill="#FFFFFF" data-density="0.98" />
  </g>
</svg>
