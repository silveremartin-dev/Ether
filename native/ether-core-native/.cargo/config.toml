[build]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
linker = "linkers/zig-linux-x86_64.cmd"

[target.aarch64-unknown-linux-gnu]
linker = "linkers/zig-linux-aarch64.cmd"

[target.x86_64-apple-darwin]
linker = "linkers/zig-macos-x86_64.cmd"

[target.aarch64-apple-darwin]
linker = "linkers/zig-macos-aarch64.cmd"

