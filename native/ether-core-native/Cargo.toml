[package]
name = "ether-core-native"
version = "1.0.0-beta.1"
edition = "2021"
authors = ["Silvere Martin-Michiellot"]
description = "High-Performance Cliodynamic Physics & Thermodynamic Simulation Engine for Ether"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
