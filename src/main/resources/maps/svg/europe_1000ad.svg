<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <!-- Europe 1000 AD (High Middle Ages - Turn of the Millennium) -->
  <g data-layer="SOVEREIGNTY">
    <!-- Holy Roman Empire (Otto III) -->
    <path d="M 500 110 L 560 105 L 565 175 L 505 170 Z" fill="#EAB308" data-sovereignty="1" data-density="0.8" data-label="Saint-Empire Romain Germanique (Otton III)"/>
    <!-- Kingdom of France (Capetian Hugh Capet / Robert II) -->
    <path d="M 455 125 L 505 120 L 495 170 L 450 165 Z" fill="#2563EB" data-sovereignty="2" data-density="0.75" data-label="Royaume de France (Capétiens)"/>
    <!-- Kievan Rus (Vladimir the Great) -->
    <path d="M 560 85 L 670 75 L 660 150 L 565 155 Z" fill="#0EA5E9" data-sovereignty="3" data-density="0.45" data-label="Rus' de Kiev (Vladimir le Grand)"/>
    <!-- Byzantine Empire (Basil II Bulgar-Slayer) -->
    <path d="M 570 155 L 650 145 L 640 215 L 565 205 Z" fill="#8B5CF6" data-sovereignty="4" data-density="0.9" data-label="Empire Byzantin (Basile II)"/>
    <!-- Caliphate of Cordoba (Al-Andalus / Al-Mansur) -->
    <path d="M 430 155 L 485 150 L 475 205 L 420 195 Z" fill="#10B981" data-sovereignty="5" data-density="0.8" data-label="Califat de Cordoue (Al-Andalus)"/>
  </g>
  <g data-layer="ISOGLOSS">
    <!-- Old French / Langue d'Oïl & d'Oc -->
    <path d="M 455 125 L 505 120 L 495 170 L 450 165 Z" fill="#3B82F6" data-isogloss="1" data-label="Gallo-Romain (Ancien Français)"/>
    <!-- High / Low German -->
    <path d="M 500 110 L 560 105 L 565 175 L 505 170 Z" fill="#F59E0B" data-isogloss="2" data-label="Haut &amp; Bas Allemand"/>
    <!-- Old East Slavic -->
    <path d="M 560 85 L 670 75 L 660 150 L 565 155 Z" fill="#06B6D4" data-isogloss="3" data-label="Vieux Slavon Oriental"/>
    <!-- Andalusian Arabic -->
    <path d="M 430 155 L 485 150 L 475 205 L 420 195 Z" fill="#10B981" data-isogloss="4" data-label="Arabe Andalou &amp; Mozarabe"/>
  </g>
  <g data-layer="KINSHIP">
    <!-- West Slavs, East Slavs, South Slavs -->
    <path d="M 540 85 L 670 75 L 660 180 L 545 175 Z" fill="#A855F7" data-kinship="1" data-label="Ethnos Slave"/>
    <!-- Germanic & Norse -->
    <path d="M 490 70 L 570 65 L 565 160 L 490 155 Z" fill="#F43F5E" data-kinship="2" data-label="Lignées Germaniques &amp; Scandinaves"/>
  </g>
  <g data-layer="RITUALS">
    <!-- Western Catholic Christianity -->
    <path d="M 440 100 L 565 95 L 555 180 L 440 175 Z" fill="#3B82F6" data-rituals="1" data-label="Christianisme Latin (Rome)"/>
    <!-- Eastern Orthodox Christianity (Christianization of Rus 988) -->
    <path d="M 560 85 L 670 75 L 640 215 L 565 205 Z" fill="#A855F7" data-rituals="2" data-label="Christianisme Oriental (Byzance)"/>
    <!-- Islamic Umayyad Sphere -->
    <path d="M 430 155 L 485 150 L 475 205 L 420 195 Z" fill="#10B981" data-rituals="3" data-label="Islam Sunnite Andalou"/>
  </g>
</svg>
