<svg xmlns="http://www.w3.org/2001/XMLSchema-instance" viewBox="0 0 1024 512" width="1024" height="512">
  <g id="sovereignty_layer" data-layer="SOVEREIGNTY">
    <!-- Imperium Romanum Core (Italy, Gaul, Hispania, Greece, Anatolia, Egypt, North Africa) -->
    <path id="roman_empire_core" fill="#DC2626" data-density="0.85" d="M 486 132 L 512 126 L 568 135 L 610 148 L 625 182 L 602 188 L 575 174 L 545 185 L 510 192 L 478 180 L 460 162 Z" />
    <path id="roman_hispania" fill="#DC2626" data-density="0.65" d="M 460 162 L 478 180 L 462 205 L 438 212 L 416 195 L 420 168 Z" />
    <path id="roman_gaul" fill="#DC2626" data-density="0.70" d="M 470 118 L 505 120 L 512 126 L 486 132 L 460 162 L 452 140 L 460 125 Z" />
    <path id="roman_egypt" fill="#DC2626" data-density="0.90" d="M 590 198 L 615 198 L 620 235 L 595 235 Z" />
  </g>

  <g id="isogloss_layer" data-layer="ISOGLOSS">
    <!-- Latin Language Sphere (Western Empire) -->
    <path id="lang_latin" fill="#3B82F6" d="M 416 140 L 512 126 L 535 180 L 450 212 Z" />
    <!-- Greek Language Sphere (Eastern Empire) -->
    <path id="lang_greek" fill="#06B6D4" d="M 535 135 L 625 148 L 625 190 L 535 180 Z" />
    <!-- Celtic Substratum -->
    <path id="lang_celtic" fill="#22C55E" d="M 440 100 L 500 105 L 490 130 L 440 130 Z" />
    <!-- Semitic / Aramaic Sphere -->
    <path id="lang_aramaic" fill="#EF4444" d="M 610 165 L 638 165 L 638 210 L 600 210 Z" />
  </g>

  <g id="kinship_layer" data-layer="KINSHIP">
    <!-- Roman Gens & Patrilineal Legal System -->
    <path id="kinship_roman_gens" fill="#A855F7" d="M 416 120 L 625 120 L 625 220 L 416 220 Z" />
  </g>

  <g id="rituals_layer" data-layer="RITUALS">
    <!-- Imperial Cult / Capitoline Religion (Rome) -->
    <circle id="ritual_rome" cx="548" cy="142" r="18" fill="#EF4444" />
    <!-- Serapis & Alexandrian Mysteries -->
    <circle id="ritual_alexandria" cx="598" cy="198" r="15" fill="#F59E0B" />
    <!-- Oracle of Delphi -->
    <circle id="ritual_delphi" cx="578" cy="155" r="12" fill="#06B6D4" />
  </g>

  <g id="density_layer" data-layer="DENSITY">
    <!-- Rome Urban Hub -->
    <circle id="density_rome" cx="548" cy="142" r="22" fill="#FFFFFF" data-density="1.0" />
    <!-- Alexandria Urban Hub -->
    <circle id="density_alexandria" cx="598" cy="198" r="18" fill="#E2E8F0" data-density="0.9" />
    <!-- Antioch Hub -->
    <circle id="density_antioch" cx="616" cy="162" r="14" fill="#CBD5E1" data-density="0.8" />
  </g>
</svg>
