<svg xmlns="http://www.w3.org/2001/XMLSchema-instance" viewBox="0 0 1024 512" width="1024" height="512">
  <g id="sovereignty_layer" data-layer="SOVEREIGNTY">
    <!-- North American Sovereign Pole -->
    <path id="sov_na" fill="#3B82F6" data-density="0.85" d="M 170 100 L 300 100 L 300 200 L 170 200 Z" />
    <!-- European Sovereign Pole -->
    <path id="sov_eu" fill="#10B981" data-density="0.90" d="M 460 90 L 560 90 L 560 160 L 460 160 Z" />
    <!-- East Asian Sovereign Pole -->
    <path id="sov_ea" fill="#EF4444" data-density="0.95" d="M 780 110 L 920 110 L 920 220 L 780 220 Z" />
    <!-- South Asian Sovereign Pole -->
    <path id="sov_sa" fill="#F59E0B" data-density="0.95" d="M 700 160 L 780 160 L 780 240 L 700 240 Z" />
  </g>

  <g id="isogloss_layer" data-layer="ISOGLOSS">
    <!-- English Global Lingua Franca -->
    <path id="lang_english" fill="#3B82F6" d="M 170 100 L 300 100 L 300 200 L 170 200 Z" />
    <!-- Mandarin Chinese Sphere -->
    <path id="lang_mandarin" fill="#EF4444" d="M 780 110 L 870 110 L 870 200 L 780 200 Z" />
    <!-- Spanish / Portuguese Sphere -->
    <path id="lang_spanish" fill="#F59E0B" d="M 200 200 L 330 200 L 330 380 L 200 380 Z" />
  </g>

  <g id="kinship_layer" data-layer="KINSHIP">
    <!-- Atomized Urban Nuclear Family Structure -->
    <path id="kinship_atomized" fill="#A855F7" d="M 0 0 L 1024 0 L 1024 512 L 0 512 Z" />
  </g>

  <g id="rituals_layer" data-layer="RITUALS">
    <!-- Financial / Tech Megacity Spheres (New York, London, Tokyo, Shanghai) -->
    <circle id="ritual_ny" cx="301" cy="140" r="18" fill="#3B82F6" />
    <circle id="ritual_london" cx="511" cy="109" r="18" fill="#10B981" />
    <circle id="ritual_tokyo" cx="909" cy="154" r="20" fill="#EF4444" />
    <circle id="ritual_shanghai" cx="857" cy="167" r="18" fill="#F59E0B" />
  </g>

  <g id="density_layer" data-layer="DENSITY">
    <!-- Tokyo Megacity (37M) -->
    <circle id="density_tokyo" cx="909" cy="154" r="25" fill="#FFFFFF" data-density="1.0" />
    <!-- Pearl River / Shanghai Yangtze Delta -->
    <circle id="density_shanghai" cx="857" cy="167" r="22" fill="#E2E8F0" data-density="0.95" />
    <!-- New York Tri-State -->
    <circle id="density_ny" cx="301" cy="140" r="20" fill="#E2E8F0" data-density="0.90" />
    <!-- London Metro -->
    <circle id="density_london" cx="511" cy="109" r="18" fill="#CBD5E1" data-density="0.85" />
  </g>
</svg>
