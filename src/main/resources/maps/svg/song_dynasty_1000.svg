<svg xmlns="http://www.w3.org/2001/XMLSchema-instance" viewBox="0 0 1024 512" width="1024" height="512">
  <g id="sovereignty_layer" data-layer="SOVEREIGNTY">
    <!-- Song Dynasty China Core (Yellow & Yangtze River Corridors) -->
    <path id="song_sovereignty" fill="#EF4444" data-density="0.90" d="M 795 136 L 868 136 L 860 205 L 795 205 Z" />
    <!-- Liao Dynasty Frontier (Kitan) -->
    <path id="liao_sovereignty" fill="#8B5CF6" data-density="0.50" d="M 795 110 L 875 110 L 868 136 L 795 136 Z" />
  </g>

  <g id="isogloss_layer" data-layer="ISOGLOSS">
    <!-- Middle Chinese / Guan Dialects -->
    <path id="lang_chinese_song" fill="#F59E0B" d="M 795 136 L 868 136 L 860 175 L 795 175 Z" />
    <!-- Yue / Southern Coastal Chinese -->
    <path id="lang_yue_chinese" fill="#10B981" d="M 795 175 L 860 175 L 855 205 L 795 205 Z" />
  </g>

  <g id="kinship_layer" data-layer="KINSHIP">
    <!-- Confucian Patrilineal Clan System & Ancestral Halls -->
    <path id="kinship_confucian_clan" fill="#A855F7" d="M 795 136 L 868 136 L 860 205 L 795 205 Z" />
  </g>

  <g id="rituals_layer" data-layer="RITUALS">
    <!-- Imperial Confucian Temple of Kaifeng -->
    <circle id="ritual_kaifeng" cx="837" cy="157" r="18" fill="#EF4444" />
    <!-- Hangzhou West Lake Sacred Sphere -->
    <circle id="ritual_hangzhou" cx="853" cy="170" r="16" fill="#F59E0B" />
  </g>

  <g id="density_layer" data-layer="DENSITY">
    <!-- Kaifeng Megacity (1 Million+ inhabitants) -->
    <circle id="density_kaifeng" cx="837" cy="157" r="22" fill="#FFFFFF" data-density="1.0" />
    <!-- Hangzhou Southern Capital -->
    <circle id="density_hangzhou" cx="853" cy="170" r="20" fill="#E2E8F0" data-density="0.95" />
  </g>
</svg>
