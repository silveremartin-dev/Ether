engine.guide.window_title=💡 Engine Recommendations Guide (Cohorts, H3 & Time-Step)
engine.guide.header_title=💡 OPTIMAL ETHER SIMULATION ENGINE CONFIGURATION GUIDE
engine.guide.header_subtitle=Scientific and computational guidance on balancing CPU/GPU throughput and historical-physical fidelity.
engine.guide.card1.title=👥 1. DEMOGRAPHIC COHORT SIZING (DUNBAR & DOD AGENTS)
engine.guide.card1.body=Cohort size defines the mean number of humans grouped into a single agent node within the vectorized DOD buffer:\n• Minimum (1 to 30 people/cohort): Nomadic paleolithic bands, hunter-gatherer clans, and space outpost micro-crews. Maximum fidelity but higher total agent count.\n• Default Recommended (150 people/cohort): Anthropological Dunbar number. Models natural Neolithic villages, agrarian tribes, and urban neighborhoods. Optimal balance of accuracy and runtime speed.\n• Maximum / Macro (1,000 to 50,000 people/cohort): Ancient metropolises, medieval empires, and modern industrial macro-demographics to maximize simulation tick rate on massive populations.
engine.guide.card2.title=🌐 2. H3 SPATIAL RESOLUTION (PLANETARY HEXAGONS)
engine.guide.card2.body=H3 spatial discretization controls the global hexagonal mesh of the planet:\n• Resolution 2 (~1,100 km per cell, ~4,100 cells): Ultra-fast multi-millennia macro-historical simulations.\n• Resolution 3 (~420 km per cell, ~28,000 cells - Planetary Recommended): Golden ratio for global Earth and exoplanet runs with full tensor coupling.\n• Resolution 4-5 (~160 km to ~60 km): Ideal for continental and regional scenarios (Mediterranean Basin, Mesopotamia, Warring States China).\n• Resolution 6+ (≤ 20 km): High-definition micro-topography. Requires powerful multi-core CPU/GPU acceleration.
engine.guide.card3.title=⏱️ 3. TEMPORAL RESOLUTION (TIME-STEP Δt)
engine.guide.card3.body=The time-step Δt controls the update rate of physical and sociological differential equations:\n• 1 Day / 1 Week (Short Step): Recommended for acute epidemiological surges (Black Death, Smallpox), tactical military movements, and sharp seasonal climate shocks.\n• 1 Month (~30 days - Standard Recommended): Universal Ether baseline. Perfectly captures agrarian cycles (sowing, harvest, Nile floods), seasonal temperature, and demographics with high framerate.\n• 1 Year (365 days - Long Step): Recommended for deep time campaigns (e.g. Out of Africa -100,000 BP) to traverse millennia in minutes.
engine.guide.card4.title=🎯 4. RECOMMENDED PRESETS BY USE CASE
engine.guide.card4.body=• Deep History (-100k to 0): H3 Res 2-3 | Step: 1 month or 1 year | Cohort: 30 to 150\n• Classical / Medieval Civilizations: H3 Res 3-4 | Step: 1 month | Cohort: 150 to 500\n• Modern Era / Energy Transition: H3 Res 3 | Step: 1 month | Cohort: 1,000 to 5,000\n• Epidemiology / Acute Shock: H3 Res 4-5 | Step: 1 day or 7 days | Cohort: 50 to 150
engine.guide.btn_close=Close
engine.guide.btn_close.tooltip=Close this recommendation guide.

