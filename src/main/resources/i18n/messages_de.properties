# Snapshot Autopruning and Explanations
snapshot.modal.card5.title=🧹 5. AUTONOMOUS MANAGEMENT & LOGARITHMIC TIME-DECAY PRUNING
snapshot.modal.card5.body=• Zero Manual Maintenance Required: The persistence subsystem manages snapshots 100% autonomously, sparing the user from manual file cleanup.\n• Logarithmic Time-Decay Retention: Recent simulation ticks are preserved at high temporal density, while older epochs are progressively thinned across logarithmic intervals. This ensures exhaustive multi-millennia chronological depth with a featherlight memory and disk footprint.
scenario.snapshot.auto_pruning_notice=ℹ️ Autonomous Operation: Snapshots are automatically recorded by the simulation engine at periodic intervals and pruned logarithmically over time. No manual deletion is needed: historical coverage scales seamlessly across millennia without saturating memory or disk space.
scenario.snapshot.auto_pruning_tooltip=Autonomous snapshot maintenance: High temporal density for recent years with logarithmic spacing for distant epochs, ensuring continuous and lightweight save tracking.

# Hints
scenario.h3.hint=• Res 2–3: Global planetary / multi-millennia (~41k cells) | Res 4–5: Regional (~2.8M cells) | Res 6+: Micro-watershed.
scenario.temporal.hint=• 1 Month: Recommended default (optimal seasons/speed) | 1 Day/Wk: Epidemics & weather shocks | 1 Year: Ultra-fast multi-millennia.
scenario.cohort.hint=• 1–30: Nomadic micro-bands | 150: Recommended default (Dunbar's number) | 10k–50k: Macro-cohorts / metropolises.

