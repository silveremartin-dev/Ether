scenario.tooltip.events.clear=Clear all scheduled events from the calendar.
scenario.tooltip.events.load_biophysical=Load and inject Earth biophysical catastrophe catalog (volcanoes, earthquakes, climatic anomalies).
scenario.tooltip.events.load_leaders=Load and inject catalog of known Earth historical figures (conquerors, lawgivers, builders, reformers).
scenario.tooltip.random_biophysical=🌋 STOCHASTIC BIOPHYSICAL EVENTS & CATASTROPHES\n• If enabled: Engine generates spontaneous biophysical crises (eruptions, quakes, plagues, famines) seeded by the scenario PRNG seed.\n• If disabled: No spontaneous biophysical crises occur.
scenario.tooltip.random_political=👑 STOCHASTIC POLITICAL & SOCIETAL EVENTS\n• If enabled: Engine stochastically spawns emergent historical leaders and rupture figures based on social stress and institutional complexity.\n• If disabled: Pure structural sociological trajectory without biographical outliers.

