snapshot.modal.card1.body=Ein Snapshot (oder Zustandskontrollpunkt) ist eine vollst├ñndige, bitidentische und deterministische Erfassung des Planeten und der Zivilisation zu einem bestimmten Tick oder Jahr T.\nAlle physikalischen, demografischen und chemischen Erhaltungsgesetze bleiben ohne Genauigkeitsverlust erhalten.
snapshot.modal.card1.title=­ƒÆí 1. DEFINITION & WESEN EINES SNAPSHOTS
snapshot.modal.card2.body=ÔÇó H3-Zellzust├ñnde: Menschliche Biomasse, Nahrungsvorr├ñte, Grundwasser, Boden-NPK-N├ñhrstoffe, Sachkapital (KÔéÇ), Energie (EÔéÇ), Wissen (IÔéÇ) und Technologie.\nÔÇó DOD-Register: Vektorisierte Kohortenpuffer, Alterspyramiden und Migrationsstr├Âme.\nÔÇó Klima & Zeit: Kalenderjahr, Monat, Strahlungsantrieb und Kohlenstoffbilanz.\nÔÇó Soziopolitische Einheiten: Grenzen, kulturelle Affinit├ñtsmatrizen und Ereignisprotokolle.
snapshot.modal.card2.title=­ƒ¬É 2. ERFASSTE VARIABLEN & ERHALTUNGSREGISTER
snapshot.modal.card3.body=ÔÇó Asynchrone Rolling Checkpoints: Die Simulations-Engine speichert alle 60 Ticks automatisch und asynchron Checkpoints auf der Festplatte, ohne die Benutzeroberfl├ñche zu blockieren.\nÔÇó Schneller Warmstart: Das Laden eines Snapshots stellt die H3/DOD-Strukturen direkt im RAM wieder her, ohne vergangene Jahrhunderte neu berechnen zu m├╝ssen.
snapshot.modal.card3.title=ÔÜí 3. HINTERGRUND-CHECKPOINTS & SOFORTIGE WIEDERHERSTELLUNG
snapshot.modal.card4.body=Sie k├Ânnen von jedem historischen Schl├╝sseljahr (z. B. 2040) abzweigen, Gesetze oder Infrastruktur anpassen oder Krisen ausl├Âsen und die Divergenz der Zivilisation gegen├╝ber der urspr├╝nglichen Sitzung beobachten.
snapshot.modal.card4.title=­ƒöÇ 4. MULTIVERSUM & TRAJEKTORIEN-VERZWEIGUNG (BRANCHING)
snapshot.modal.header_subtitle=Technischer Leitfaden zu deterministischer Persistenz, asynchronen Checkpoints und Trajektorien-Verzweigung.
snapshot.modal.header_title=­ƒô© WAS IST EIN SNAPSHOT & WIE FUNKTIONIERT ER?
