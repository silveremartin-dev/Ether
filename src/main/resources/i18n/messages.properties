source.demo.hyde.desc=­ƒôí SOURCE: History Database of the Global Environment (HYDE 3.4)\n­ƒÅø´©Å ORGANIZATION: PBL Netherlands Environmental Assessment Agency & Utrecht University\n­ƒö¼ VARIABLES: Historical population density, urban/rural ratios, cropland and grazing allocations\n­ƒîÉ RESOLUTION: 5 arc-min (~8.5 km at equator) in 2:1 equirectangular projection\n­ƒôà TIME RANGE: 10,000 BC to 2023 AD calibrated historical time series\n­ƒôÜ CITATION: Klein Goldewijk et al. (2017) Earth System Science Data, 9(2), 927-953.
source.demo.paleo.desc=­ƒôí SOURCE: Homo Sapiens Global Expansion & Paleo-Demography Model\n­ƒÅø´©Å ORGANIZATION: Max Planck Institute for Evolutionary Anthropology & CalPal Database\n­ƒö¼ VARIABLES: Initial hunter-gatherer carrying capacities (people/km┬▓), coastal migration corridors\n­ƒîÉ COVERAGE: Multiresolution H3 spatial grid calibrated to MIS 5 / MIS 4 climate (-100k to -50k BP)\n­ƒôÜ CITATION: Tallavaara et al. (2015) PNAS; Henn et al. (2012) PLOS Genetics.
