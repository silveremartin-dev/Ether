resource.tensor.1.desc=Coal basins and anthracite deposits. Source: USGS MRDS / BGR Germany.
resource.tensor.1.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 Gt | White (255) = 5.0 Gt (USGS MRDS / BGR Germany)
resource.tensor.1.param1=Coal Seam Abundance & Thickness (Gt)
resource.tensor.1.param1.tt=Controls global abundance and average thickness of coal seams in sedimentary basins (Gt).
resource.tensor.1.param2=Swamp Paleo-Biomass Threshold (%)
resource.tensor.1.param2.tt=Minimum percentage of paleolithic wetland vegetation required for peat accumulation.
resource.tensor.1.param3=Coalification Rank (Anthracitization)
resource.tensor.1.param3.tt=Thermal metamorphism rank (%Ro vitrinite). 0=Lignite, 0.5=Bituminous, 1.0=Pure anthracite.
resource.tensor.1.param4=Sedimentary Cover Thickness
resource.tensor.1.param4.tt=Lithostatic burial depth in paralic basins promoting sedimentary compaction (km).
resource.tensor.1.source.baseline=USGS MRDS / BGR Coal Deposits (Earth Baseline)
resource.tensor.1.title=⛏️ 4.1 Coal Deposits (COAL — USGS / BGR)
resource.tensor.2.desc=Bituminous basins and offshore & continental oil fields. Source: World Energy Projection / BGR.
resource.tensor.2.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 Gt | White (255) = 5.0 Gt (World Energy Projection / BGR)
resource.tensor.2.param1=Oil Reserves & Tectonic Traps (Gt)
resource.tensor.2.param1.tt=Total volume of liquid hydrocarbons trapped in subterranean reservoirs (Gt).
resource.tensor.2.param2=Anoxic Source Rock Maturation (%)
resource.tensor.2.param2.tt=Total Organic Carbon (TOC) rate deposited in marine shales under anoxic conditions.
resource.tensor.2.param3=Anticlinal Trap & Fault Density
resource.tensor.2.param3.tt=Frequency of folded tectonic deformations and salt domes halting oil migration.
resource.tensor.2.param4=Oil Window Temperature
resource.tensor.2.param4.tt=Natural pyrolysis temperature range (60°C-180°C) converting kerogen to crude oil.
resource.tensor.2.source.baseline=World Energy Projection / BGR Oil Reserves (Earth Baseline)
resource.tensor.2.title=🛢️ 4.2 Crude Oil & Fuel Reserves (CRUDE_OIL — WEP / BGR)
resource.tensor.3.desc=Conventional and non-conventional natural gas fields (shale gas). Source: WEP / BGR.
resource.tensor.3.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 10¹² m³ | White (255) = 5.0 10¹² m³ (WEP / BGR Germany)
resource.tensor.3.param1=Reservoir Pressure & Gas Abundance (10¹² m³)
resource.tensor.3.param1.tt=Total volume of conventional and unconventional natural gas stored under pressure (10¹² m³).
resource.tensor.3.param2=Thermogenic Shale Gas Fraction (%)
resource.tensor.3.param2.tt=Proportion of deep thermal cracking gas compared to surface biogenic gas.
resource.tensor.3.param3=Cratonic Reservoir Depth
resource.tensor.3.param3.tt=Depth of sandstone and carbonate reservoir formations impacting gas retention (km).
resource.tensor.3.param4=Caprock Impermeability
resource.tensor.3.param4.tt=Sealing capacity of evaporite and shale layers preventing gas leakage to the surface.
resource.tensor.3.source.baseline=WEP / BGR Natural Gas Fields (Earth Baseline)
resource.tensor.3.title=🔥 4.3 Natural Gas Fields (NATURAL_GAS — WEP / BGR)
resource.tensor.4.desc=Pitchblende concentration and uranium/thorium deposits. Source: IAEA UDEPO / NFCIS.
resource.tensor.4.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 ppm | White (255) = 1,000 ppm U (IAEA UDEPO / NFCIS)
resource.tensor.4.param1=Uranium Pegmatite Crustal Grade (ppm)
resource.tensor.4.param1.tt=Average Uranium concentration in magmatic crust and fertile granites (ppm).
resource.tensor.4.param2=Hydrothermal Infiltration Rate
resource.tensor.4.param2.tt=Hydrothermal fluid circulation leaching and precipitating pitchblende (UO₂) in veins.
resource.tensor.4.param3=Thorium/Uranium Mass Ratio
resource.tensor.4.param3.tt=Natural Th²³²/U²³⁸ isotopic ratio. Higher ratio favors Thorium mineralizations.
resource.tensor.4.param4=Redox Fronts & Unconformities
resource.tensor.4.param4.tt=Intensity of reduction-oxidation traps at Proterozoic unconformities (Athabasca type).
resource.tensor.4.source.baseline=IAEA UDEPO / NFCIS Uranium Database (Earth Baseline)
resource.tensor.4.title=⚛️ 4.4 Uranium & Fission Ores (URANIUM — IAEA UDEPO)
resource.tensor.5.desc=Regolith enriched in Helium-3 (lunar basin & planetary deposits). Source: NASA PDS / LPI.
