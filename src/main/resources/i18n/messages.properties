source.climate.temp.wms.desc=­ƒôí SOURCE: NASA MERRA-2 Atmospheric Reanalysis (WMS Satellite)\n­ƒÅø´©Å ORGANIZATION: NASA Goddard Earth Sciences Data and Information Services Center\n­ƒö¼ VARIABLES: 2D surface air temperature and energy balance fluxes\n­ƒôÜ CITATION: Gelaro et al. (2017) Journal of Climate, 30(14), 5419-5454.
