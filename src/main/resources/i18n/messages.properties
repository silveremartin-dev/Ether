planet.preset.earth=Earth (Terran)
planet.preset.earth.desc=­ƒîì EARTH (2026 / Modern Baseline): Standard Terran planet with 70.8% ocean coverage, 15.0┬░C global mean temperature, 420 ppm COÔéé, 1.0 atm atmospheric pressure, and modern satellite-derived biosphere.
planet.preset.earth_bronze=Earth (-1,900 / Middle Bronze Age)
planet.preset.earth_bronze.desc=­ƒÅ║ EARTH (-1,900 BP / Middle Bronze Age): Established transcontinental trade routes (copper, tin, amber), early legal codification, hydraulic city-states, and monumental temple architecture.
planet.preset.earth_eh=Earth (-10,000 / Early Holocene)
planet.preset.earth_eh.desc=­ƒî¥ EARTH (-10,000 BP / Early Holocene & Agriculture): Rapid post-glacial warming, melting continental ice sheets, wild cereal harvesting in the Fertile Crescent, and dawn of plant/animal domestication.
planet.preset.earth_iron=Earth (-1,000 / Early Iron Age)
planet.preset.earth_iron.desc=ÔÜö´©Å EARTH (-1,000 BP / Early Iron Age): Blast furnaces and widespread iron metallurgy, deforestation for charcoal smelting, expansion of classical empires and monetary economies across Eurasia.
planet.preset.earth_lgm=Earth (-20,000 / Last Glacial Maximum)
planet.preset.earth_lgm.desc=ÔØä´©Å EARTH (-20,000 BP / Last Glacial Maximum Peak): Global temperature anomaly -5┬░C to -6┬░C, ice sheets up to 3 km thick over North America and Fennoscandia, sea level at -125m, vast arid mammoth steppe-tundras.
planet.preset.earth_lgm_onset=Earth (-25,000 / LGM Onset & Beringia)
planet.preset.earth_lgm_onset.desc=­ƒÅö´©Å EARTH (-25,000 BP / LGM Onset & Beringia): Onset of the Last Glacial Maximum. Falling sea levels (-100m) expose the Bering land bridge connecting Siberia and Alaska, enabling human migration to the Americas.
planet.preset.earth_lh=Earth (-3,000 / Late Holocene)
planet.preset.earth_lh.desc=­ƒÅø´©Å EARTH (-3,000 BP / Late Holocene): Modern coastline stabilization, progressive aridification of the Sahara, and rise of hydraulic agrarian empires along the Nile, Tigris-Euphrates, Indus, and Yellow Rivers.
planet.preset.earth_lig=Earth (-100,000 / Last Interglacial)
planet.preset.earth_lig.desc=­ƒîì EARTH (-100,000 BP / Last Interglacial / Eemian): Warm interglacial climate (+1 to +2┬░C above pre-industrial), sea level +6 to +9m above modern datum. Green Sahara corridors and early Homo Sapiens expansion out of Africa.
planet.preset.earth_mh=Earth (-6,000 / Green Sahara)
planet.preset.earth_mh.desc=­ƒî┤ EARTH (-6,000 BP / Mid-Holocene & Green Sahara): Holocene Thermal Maximum with amplified African monsoons. The Sahara is a fertile savanna with mega-lakes and rivers supporting thriving pastoral communities.
planet.preset.earth_mis3=Earth (-50,000 / MIS 3 & Sahul Colonization)
planet.preset.earth_mis3.desc=­ƒªÿ EARTH (-50,000 BP / MIS 3 Interstadial): Temperate glacial climate with sea level at -60m, exposing the Sunda and Sahul continental shelves across the Wallace Line; first maritime ocean crossing and settlement of Australia.
planet.preset.earth_modern=Earth (2026 / Modern)
planet.preset.earth_modern.desc=­ƒîì EARTH (2026 / Modern Anthropocene): Standard Terran baseline with 70.8% ocean coverage, 15.0┬░C global mean temperature, 420 ppm COÔéé, industrial globalization, and satellite-calibrated ecologies.
planet.preset.eyeball=Tidally Locked (Eyeball)
planet.preset.eyeball.desc=­ƒæü´©Å TIDALLY LOCKED WORLD (Eyeball): Synchronous rotation around a red dwarf star. Permanent blistering day side, frozen night hemisphere, and a narrow habitable twilight terminator ring.
planet.preset.heightmap=­ƒôÀ Preset Heightmap
planet.preset.hydro=­ƒÆº Preset Hydro
planet.preset.ice=Ice World (Boreas)
planet.preset.ice.desc=­ƒºè ICE WORLD (Boreas): Deep snowball planet locked in runaway glaciation. Global ice sheets, cryogenic oceans under thick pack ice, high albedo (0.65), and severe biological productivity constraints.
planet.preset.mars=Mars (Ares)
planet.preset.mars.desc=­ƒö┤ MARS (Ares): Hyper-arid desert world with thin COÔéé atmosphere (0.006 atm), ancient volcanic shield volcanoes (Olympus Mons), canyon systems (Valles Marineris), and polar dry-ice caps.
planet.preset.moon=Moon (Selene)
planet.preset.moon.desc=ÔÜ¬ MOON (Selene): Airless cratered satellite with titanium-rich basaltic maria, anorthositic highlands, extreme diurnal thermal swings (-170┬░C to +120┬░C), and solar wind Helium-3 implantation.
