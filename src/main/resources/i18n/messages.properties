planet.preset=Global Preset
planet.preset.archipelago=Archipelago
planet.preset.archipelago.desc=🏝️ ARCHIPELAGO WORLD: Oceanic world dotted with micro-continents, island chains, and shallow seas. High maritime transport efficiency, low continuous agricultural landmasses, strong naval trade dependencies.
planet.preset.biomes=🌿 Preset Biomes
planet.preset.climate=🌡️ Preset Climate
planet.preset.earth=Earth (Terran)
planet.preset.earth.desc=🌍 EARTH (2026 / Modern Baseline): Standard Terran planet with 70.8% ocean coverage, 15.0°C global mean temperature, 420 ppm CO₂, 1.0 atm atmospheric pressure, and modern satellite-derived biosphere.
planet.preset.earth_modern=Earth (2026 / Modern)
planet.preset.earth_modern.desc=🌍 EARTH (2026 / Modern Anthropocene): Standard Terran baseline with 70.8% ocean coverage, 15.0°C global mean temperature, 420 ppm CO₂, industrial globalization, and satellite-calibrated ecologies.
planet.preset.earth_iron=Earth (-1,000 / Early Iron Age)
planet.preset.earth_iron.desc=⚔️ EARTH (-1,000 BP / Early Iron Age): Blast furnaces and widespread iron metallurgy, deforestation for charcoal smelting, expansion of classical empires and monetary economies across Eurasia.
planet.preset.earth_bronze=Earth (-1,900 / Middle Bronze Age)
planet.preset.earth_bronze.desc=🏺 EARTH (-1,900 BP / Middle Bronze Age): Established transcontinental trade routes (copper, tin, amber), early legal codification, hydraulic city-states, and monumental temple architecture.
planet.preset.earth_lh=Earth (-3,000 / Late Holocene)
planet.preset.earth_lh.desc=🏛️ EARTH (-3,000 BP / Late Holocene): Modern coastline stabilization, progressive aridification of the Sahara, and rise of hydraulic agrarian empires along the Nile, Tigris-Euphrates, Indus, and Yellow Rivers.
planet.preset.earth_mh=Earth (-6,000 / Green Sahara)
planet.preset.earth_mh.desc=🌴 EARTH (-6,000 BP / Mid-Holocene & Green Sahara): Holocene Thermal Maximum with amplified African monsoons. The Sahara is a fertile savanna with mega-lakes and rivers supporting thriving pastoral communities.
planet.preset.earth_eh=Earth (-10,000 / Early Holocene)
planet.preset.earth_eh.desc=🌾 EARTH (-10,000 BP / Early Holocene & Agriculture): Rapid post-glacial warming, melting continental ice sheets, wild cereal harvesting in the Fertile Crescent, and dawn of plant/animal domestication.
planet.preset.earth_lgm=Earth (-20,000 / Last Glacial Maximum)
planet.preset.earth_lgm.desc=❄️ EARTH (-20,000 BP / Last Glacial Maximum Peak): Global temperature anomaly -5°C to -6°C, ice sheets up to 3 km thick over North America and Fennoscandia, sea level at -125m, vast arid mammoth steppe-tundras.
planet.preset.earth_lgm_onset=Earth (-25,000 / LGM Onset & Beringia)
planet.preset.earth_lgm_onset.desc=🏔️ EARTH (-25,000 BP / LGM Onset & Beringia): Onset of the Last Glacial Maximum. Falling sea levels (-100m) expose the Bering land bridge connecting Siberia and Alaska, enabling human migration to the Americas.
planet.preset.earth_mis3=Earth (-50,000 / MIS 3 & Sahul Colonization)
planet.preset.earth_mis3.desc=🦘 EARTH (-50,000 BP / MIS 3 Interstadial): Temperate glacial climate with sea level at -60m, exposing the Sunda and Sahul continental shelves across the Wallace Line; first maritime ocean crossing and settlement of Australia.
planet.preset.earth_lig=Earth (-100,000 / Last Interglacial)
planet.preset.earth_lig.desc=🌍 EARTH (-100,000 BP / Last Interglacial / Eemian): Warm interglacial climate (+1 to +2°C above pre-industrial), sea level +6 to +9m above modern datum. Green Sahara corridors and early Homo Sapiens expansion out of Africa.
planet.preset.eyeball=Tidally Locked (Eyeball)
planet.preset.eyeball.desc=👁️ TIDALLY LOCKED WORLD (Eyeball): Synchronous rotation around a red dwarf star. Permanent blistering day side, frozen night hemisphere, and a narrow habitable twilight terminator ring.
planet.preset.heightmap=📷 Preset Heightmap
planet.preset.hydro=💧 Preset Hydro
planet.preset.ice=Ice World (Boreas)
planet.preset.ice.desc=🧊 ICE WORLD (Boreas): Deep snowball planet locked in runaway glaciation. Global ice sheets, cryogenic oceans under thick pack ice, high albedo (0.65), and severe biological productivity constraints.
planet.preset.mars=Mars (Ares)
planet.preset.mars.desc=🔴 MARS (Ares): Hyper-arid desert world with thin CO₂ atmosphere (0.006 atm), ancient volcanic shield volcanoes (Olympus Mons), canyon systems (Valles Marineris), and polar dry-ice caps.
planet.preset.moon=Moon (Selene)
planet.preset.moon.desc=⚪ MOON (Selene): Airless cratered satellite with titanium-rich basaltic maria, anorthositic highlands, extreme diurnal thermal swings (-170°C to +120°C), and solar wind Helium-3 implantation.
planet.preset.rainfall=🌧️ Preset Rainfall
planet.preset.resources=🪨 Preset Resources
planet.preset.seasonality=☀️ Preset Seasonality
planet.preset.super_earth=Super-Earth (Gaia Prime)
planet.preset.super_earth.desc=🪐 SUPER-EARTH (Gaia Prime): Massive terrestrial planet (1.5 Earth radii, 2.8 Earth masses), surface gravity 1.25g, dense atmosphere (2.2 atm), and intense tectonic/volcanic mantle convective plumes.
planet.preset.titan=Titan (Cryo-Moon)
planet.preset.titan.desc=🟠 TITAN (Cryo-Moon): Massive cryogenic moon with dense nitrogen-methane atmosphere (1.5 atm, 94 K), liquid hydrocarbon lakes (methane/ethane), and water-ice bedrock mountains.
planet.preset.venus=Venus (Hesperos)
planet.preset.venus.desc=🟡 VENUS (Hesperos): Runaway greenhouse hellscape with 92 atm CO₂ atmosphere, 465°C surface temperature, sulfuric acid clouds, active basaltic volcanism, and complete absence of liquid water.
planet.preset.water=Ocean World (Oceania)
planet.preset.water.desc=🌊 OCEAN WORLD (Oceania): Panthalassic water world with 98% ocean coverage, no exposed continental cratons, deep pelagic ecosystems, and exclusive dependence on marine foraging.
