source.geo.coal.desc=­ƒôí SOURCE: USGS Mineral Resources Data System (MRDS) & BGR Global Coal Basins\n­ƒÅø´©Å ORGANIZATION: United States Geological Survey & German Federal Institute for Geosciences (BGR)\n­ƒö¼ VARIABLES: Geological Tensor 0 ÔÇö Bituminous coal, anthracite deposits, and lignite basins (Gt reserves)\n­ƒôÜ CITATION: USGS MRDS Database (2023); BGR Energy Study Reserves (2022).
source.geo.gas.desc=­ƒôí SOURCE: USGS Global Gas Assessment & Seafloor Clathrate Survey\n­ƒÅø´©Å ORGANIZATION: USGS & International Energy Agency (IEA)\n­ƒö¼ VARIABLES: Geological Tensor 2 ÔÇö Natural gas fields, shale gas formations, and oceanic methane hydrates (Tcm)\n­ƒôÜ CITATION: IEA World Energy Outlook (2023); Ruppel & Kessler (2017) Reviews of Geophysics.
