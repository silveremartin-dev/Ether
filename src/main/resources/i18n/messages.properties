source.tensor.1.murdock.desc=­ƒôí SOURCE: Murdock Ethnographic Atlas & Standard Cross-Cultural Sample (SCCS)\n­ƒÅø´©Å ORGANIZATION: University of Pittsburgh & Yale Human Relations Area Files (HRAF)\n­ƒö¼ VARIABLES: Tensor 1 ÔÇö Kinship structures, descent rules (patrilineal, matrilineal, bilateral), and exogamy\n­ƒîÉ SAMPLE: 1,167 traditional and pre-industrial human societies\n­ƒôÜ CITATION: Murdock (1967) Ethnographic Atlas; Murdock & White (1969) SCCS.
