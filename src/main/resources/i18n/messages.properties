# --- SNAPSHOT ---
snapshot.modal.btn_close=Close
snapshot.modal.btn_close.tooltip=Close this technical explanation window.
snapshot.modal.card1.body=A Snapshot (or state checkpoint) is a complete, bit-identical, and deterministic capture of the entire planetary and human civilizational state at an exact tick or year T.\nIt freezes all physical, demographic, and chemical conservation laws without any loss of precision.
snapshot.modal.card1.title=­ƒÆí 1. DEFINITION & PHYSICAL NATURE OF A SNAPSHOT
snapshot.modal.card2.body=ÔÇó H3 Hexagonal Cell States: Human biomass, food stocks, available water tables, soil N-P-K nutrients, physical capital (KÔéÇ), energy (EÔéÇ), knowledge (IÔéÇ), and technology level.\nÔÇó DOD Registers & Tensors: Vectorized cohort arrays, age pyramids, demographic cohorts, and inter-cell migration flows.\nÔÇó Climate & Time: Chronological calendar year, simulation month, season, radiative forcing, and stratospheric carbon balance.\nÔÇó Sociopolitical Entities: Territorial borders, cultural affinity matrices, and historical event journals.
snapshot.modal.card2.title=­ƒ¬É 2. CAPTURED VARIABLES & CONSERVATION REGISTERS
snapshot.modal.card3.body=ÔÇó Async Rolling Checkpoints: The simulation engine periodically persists lightweight checkpoints to disk every 60 ticks asynchronously without blocking the user interface.\nÔÇó Instant Warm-Start Restore: Resuming from a snapshot injects raw H3/DOD data structures directly into RAM, bypassing the need to re-simulate elapsed centuries or millennia.
snapshot.modal.card3.title=ÔÜí 3. BACKGROUND ROLLING CHECKPOINTS & INSTANT RESTORE
snapshot.modal.card4.body=You can branch from any pivotal historical year (e.g. 2040), alter infrastructure, modify physical laws, or inject catastrophic events (e.g. volcanic winter, technological breakthrough), and observe how civilizational trajectories diverge from the baseline run.
snapshot.modal.card4.title=­ƒöÇ 4. MULTIVERSE BRANCHING & TRAJECTORY EXPLORATION
snapshot.modal.card5.body=• Zero Manual Maintenance Required: The persistence subsystem manages snapshots 100% autonomously, sparing the user from manual file cleanup.\n• Logarithmic Time-Decay Retention: Recent simulation ticks are preserved at high temporal density, while older epochs are progressively thinned across logarithmic intervals. This ensures exhaustive multi-millennia chronological depth with a featherlight memory and disk footprint.
snapshot.modal.card5.title=🧹 5. AUTONOMOUS MANAGEMENT & LOGARITHMIC TIME-DECAY PRUNING
snapshot.modal.header_subtitle=Technical guide on deterministic state persistence, async rolling checkpoints, and multiverse branching.
snapshot.modal.header_title=­ƒô© WHAT IS A SNAPSHOT & HOW DOES IT WORK?
snapshot.modal.window_title=­ƒô© How Snapshots & Checkpoints Work in Ether

