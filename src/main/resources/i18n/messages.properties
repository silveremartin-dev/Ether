source.topo.earth.desc=­ƒôí SOURCE: NOAA ETOPO2022 Global Relief & USGS GMTED2010\n­ƒÅø´©Å ORGANIZATION: National Oceanic and Atmospheric Administration (NOAA) & USGS\n­ƒö¼ VARIABLES: Topography and bathymetry combined (-11,000m to +8,848m)\n­ƒîÉ RESOLUTION: 1 arc-minute global elevation raster calibrated to 0m sea level datum (0.478)\n­ƒôÜ CITATION: NOAA NCEI (2022) ETOPO 2022 15 Arc-Second Global Relief Model.
source.topo.mars.desc=­ƒôí SOURCE: NASA Mars Global Surveyor MOLA & USGS Astrogeology DEM\n­ƒÅø´©Å ORGANIZATION: NASA Jet Propulsion Laboratory & USGS Astrogeology Science Center\n­ƒö¼ VARIABLES: Topographic surface elevation referenced to the 6.1 mbar martian areoid\n­ƒîÉ COVERAGE: Global 100% laser altimeter mosaic\n­ƒôÜ CITATION: Smith et al. (2001) Science, 292(5525), 2307-2316.
