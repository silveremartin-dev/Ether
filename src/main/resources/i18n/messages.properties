source.climate.precip.earth.desc=­ƒôí SOURCE: NASA GPCP v2.3 & WorldClim v2.1 Bio12 Total Precipitation\n­ƒÅø´©Å ORGANIZATION: NASA Goddard Space Flight Center & WorldClim\n­ƒö¼ VARIABLES: Mean annual precipitation (mm/year) and global rainbelt distributions\n­ƒôÜ CITATION: Adler et al. (2018) Atmosphere, 9(4), 138.
source.climate.precip.mars.desc=­ƒôí SOURCE: Mars Water Vapor & Surface Frost Sublimation Model\n­ƒÅø´©Å ORGANIZATION: ESA Mars Express (OMEGA) & NASA MRO (CRISM)\n­ƒö¼ VARIABLES: Atmospheric precipitable water vapor (pr-┬Ám) and seasonal polar frost cycle\n­ƒôÜ CITATION: Smith (2004) Icarus, 167(1), 148-165.
source.climate.precip.mercury.desc=­ƒôí SOURCE: NASA MESSENGER Neutron Spectrometer Exosphere Model\n­ƒÅø´©Å ORGANIZATION: NASA & JHU/APL\n­ƒö¼ VARIABLES: Exospheric vacuum and water ice deposits in permanently shadowed north polar craters\n­ƒôÜ CITATION: Lawrence et al. (2013) Science, 339(6117), 292-296.
source.climate.precip.moon.desc=­ƒôí SOURCE: NASA LRO LEND Epithermal Neutron Detector (Vacuum Hydrology)\n­ƒÅø´©Å ORGANIZATION: NASA & Space Research Institute (IKI)\n­ƒö¼ VARIABLES: Water-ice equivalent hydrogen concentration in permanently shadowed polar craters\n­ƒôÜ CITATION: Mitrofanov et al. (2010) Science, 330(6003), 483-486.
source.climate.precip.venus.desc=­ƒôí SOURCE: Venus Atmospheric HÔééSOÔéä Virga & Desiccation Model\n­ƒÅø´©Å ORGANIZATION: ESA Venus Express & Pioneer Venus\n­ƒö¼ VARIABLES: Sulfuric acid cloud droplet condensation, mid-atmosphere virga, and surface drought\n­ƒôÜ CITATION: Titov et al. (2018) Space Science Reviews, 214(8), 126.
source.climate.precip.wms.desc=­ƒôí SOURCE: NASA GPM IMERG Global Precipitation Measurement (WMS Satellite)\n­ƒÅø´©Å ORGANIZATION: NASA GSFC & JAXA\n­ƒö¼ VARIABLES: Multi-satellite combined precipitation rates (mm/hr & mm/yr)\n­ƒôÜ CITATION: Huffman et al. (2019) NASA GPM IMERG Algorithm Theoretical Basis Document.
source.climate.season.earth.desc=­ƒôí SOURCE: WorldClim v2.1 (Bio4 Temperature Seasonality) & ECMWF ERA5\n­ƒÅø´©Å ORGANIZATION: European Centre for Medium-Range Weather Forecasts & WorldClim\n­ƒö¼ VARIABLES: Temperature Seasonality (standard deviation ├ù 100) and annual thermal range\n­ƒôÜ CITATION: Fick & Hijmans (2017) International Journal of Climatology, 37(12), 4302-4315.
source.climate.season.mars.desc=­ƒôí SOURCE: Martian Orbital Eccentricity & Obliquity Insolation Model\n­ƒÅø´©Å ORGANIZATION: NASA JPL & LMD Paris\n­ƒö¼ VARIABLES: Solar insolation variation driven by orbital eccentricity (e=0.0934) and Ls solar longitude\n­ƒôÜ CITATION: Laskar et al. (2004) Icarus, 170(2), 343-364.
source.climate.season.mercury.desc=­ƒôí SOURCE: Mercury 3:2 Spin-Orbit Resonance & Eccentricity Model\n­ƒÅø´©Å ORGANIZATION: NASA & JHU/APL\n­ƒö¼ VARIABLES: Resonance creates 'hot longitudes' and severe seasonal thermal contrasts (e=0.2056)\n­ƒôÜ CITATION: Margot et al. (2012) JGR Planets, 117(E00L09).
source.climate.season.moon.desc=­ƒôí SOURCE: Lunar Diurnal Insolation Amplitude Model (Axial Tilt 1.54┬░)\n­ƒÅø´©Å ORGANIZATION: NASA GSFC\n­ƒö¼ VARIABLES: Diurnal cycle duration (29.5 Earth days) driving extreme 300 K day/night thermal swing\n­ƒôÜ CITATION: Vasavada et al. (2012) JGR Planets, 117(E00H18).
source.climate.season.venus.desc=­ƒôí SOURCE: Venus Super-Rotation & Low-Obliquity Stability Model\n­ƒÅø´©Å ORGANIZATION: JAXA Akatsuki & ESA Venus Express\n­ƒö¼ VARIABLES: Negligible axial tilt (3.39┬░) resulting in minimal seasonal amplitude and uniform heat transport\n­ƒôÜ CITATION: Sanchez-Lavega et al. (2017) Space Science Reviews, 212(3), 1541-1616.
source.climate.season.wms.desc=­ƒôí SOURCE: NASA MODIS Land Surface Temperature Thermal Amplitude (WMS)\n­ƒÅø´©Å ORGANIZATION: NASA Land Processes Distributed Active Archive Center (LP DAAC)\n­ƒö¼ VARIABLES: Daytime minus nighttime surface temperature amplitude over annual cycle\n­ƒôÜ CITATION: Wan et al. (2015) MODIS Land Surface Temperature Products User Guide.
source.climate.temp.earth.desc=­ƒôí SOURCE: ECMWF ERA5 Atmospheric Reanalysis & WorldClim v2.1 (Bio1)\n­ƒÅø´©Å ORGANIZATION: European Centre for Medium-Range Weather Forecasts & NASA\n­ƒö¼ VARIABLES: Mean annual 2-meter air temperature (┬░C) and seasonal temperature ranges\n­ƒîÉ RESOLUTION: 0.1┬░ (~11 km) equirectangular 2:1 raster\n­ƒôÜ CITATION: Hersbach et al. (2020) QJRMS; Fick & Hijmans (2017) Int. J. Climatol.
source.climate.temp.mars.desc=­ƒôí SOURCE: Mars Global Surveyor TES & Mars Climate Database (MCD 6.1)\n­ƒÅø´©Å ORGANIZATION: NASA JPL, ESA & Laboratoire de M├®t├®orologie Dynamique (CNRS/LMD)\n­ƒö¼ VARIABLES: Martian surface radiative temperature, diurnal cycles, and COÔéé condensation\n­ƒôÜ CITATION: Forget et al. (1999) JGR Planets; Millour et al. (2023) MCD 6.1 Documentation.
source.climate.temp.mercury.desc=­ƒôí SOURCE: NASA MESSENGER Extreme Thermal & Spin-Orbit Model\n­ƒÅø´©Å ORGANIZATION: NASA & Johns Hopkins Applied Physics Laboratory\n­ƒö¼ VARIABLES: 3:2 spin-orbit resonance temperatures (100 K to 700 K) and polar cold traps\n­ƒôÜ CITATION: Vasavada et al. (1999) Icarus, 141(2), 179-193.
source.climate.temp.moon.desc=­ƒôí SOURCE: NASA LRO Diviner Lunar Radiometer Experiment\n­ƒÅø´©Å ORGANIZATION: NASA GSFC & UCLA Planetary Science\n­ƒö¼ VARIABLES: Diurnal surface temperatures (40 K to 390 K) and permanently shadowed cold traps\n­ƒôÜ CITATION: Paige et al. (2010) Science, 330(6003), 479-482.
