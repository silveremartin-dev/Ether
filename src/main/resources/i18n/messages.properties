source.topo.earth.desc=📡 SOURCE: NOAA ETOPO2022 Global Relief & USGS GMTED2010\n🏛️ ORGANIZATION: National Oceanic and Atmospheric Administration (NOAA) & USGS\n🔬 VARIABLES: Topography and bathymetry combined (-11,000m to +8,848m)\n🌐 RESOLUTION: 1 arc-minute global elevation raster calibrated to 0m sea level datum (0.478)\n📚 CITATION: NOAA NCEI (2022) ETOPO 2022 15 Arc-Second Global Relief Model.
source.topo.mars.desc=📡 SOURCE: NASA Mars Global Surveyor MOLA & USGS Astrogeology DEM\n🏛️ ORGANIZATION: NASA Jet Propulsion Laboratory & USGS Astrogeology Science Center\n🔬 VARIABLES: Topographic surface elevation referenced to the 6.1 mbar martian areoid\n🌐 COVERAGE: Global 100% laser altimeter mosaic\n📚 CITATION: Smith et al. (2001) Science, 292(5525), 2307-2316.
source.topo.venus.desc=📡 SOURCE: NASA Magellan Synthetic Aperture Radar (SAR) Altimetry\n🏛️ ORGANIZATION: NASA JPL & European Space Agency (Venus Express)\n🔬 VARIABLES: Radar surface elevation, dielectric reflectivity, and regional volcanic coronae\n📚 CITATION: Saunders et al. (1992) Journal of Geophysical Research, 97(E8), 13067.
source.topo.moon.desc=📡 SOURCE: NASA Lunar Reconnaissance Orbiter LOLA Laser Topography\n🏛️ ORGANIZATION: NASA Goddard Space Flight Center & LPI\n🔬 VARIABLES: Surface topography, impact crater morphology, and mare basalt elevations\n📚 CITATION: Smith et al. (2010) Space Science Reviews, 150(1), 209-241.
source.topo.mercury.desc=📡 SOURCE: NASA MESSENGER MLA (Mercury Laser Altimeter) & MDIS Mosaic\n🏛️ ORGANIZATION: NASA & Johns Hopkins Applied Physics Laboratory (JHU/APL)\n🔬 VARIABLES: Surface elevation, lobate scarps, and polar impact basins\n📚 CITATION: Zuber et al. (2012) Science, 336(6078), 217-220.

source.climate.temp.earth.desc=📡 SOURCE: ECMWF ERA5 Atmospheric Reanalysis & WorldClim v2.1 (Bio1)\n🏛️ ORGANIZATION: European Centre for Medium-Range Weather Forecasts & NASA\n🔬 VARIABLES: Mean annual 2-meter air temperature (°C) and seasonal temperature ranges\n🌐 RESOLUTION: 0.1° (~11 km) equirectangular 2:1 raster\n📚 CITATION: Hersbach et al. (2020) QJRMS; Fick & Hijmans (2017) Int. J. Climatol.
source.climate.temp.mars.desc=📡 SOURCE: Mars Global Surveyor TES & Mars Climate Database (MCD 6.1)\n🏛️ ORGANIZATION: NASA JPL, ESA & Laboratoire de Météorologie Dynamique (CNRS/LMD)\n🔬 VARIABLES: Martian surface radiative temperature, diurnal cycles, and CO₂ condensation\n📚 CITATION: Forget et al. (1999) JGR Planets; Millour et al. (2023) MCD 6.1 Documentation.
source.climate.temp.venus.desc=📡 SOURCE: Venus Express VIRTIS Thermal Spectrometry & Magellan Model\n🏛️ ORGANIZATION: European Space Agency & NASA JPL\n🔬 VARIABLES: Supercritical CO₂ surface temperature (465°C) and altitude lapse rates\n📚 CITATION: Svedhem et al. (2007) Nature, 450, 637-641.
source.climate.temp.moon.desc=📡 SOURCE: NASA LRO Diviner Lunar Radiometer Experiment\n🏛️ ORGANIZATION: NASA GSFC & UCLA Planetary Science\n🔬 VARIABLES: Diurnal surface temperatures (40 K to 390 K) and permanently shadowed cold traps\n📚 CITATION: Paige et al. (2010) Science, 330(6003), 479-482.
source.climate.temp.mercury.desc=📡 SOURCE: NASA MESSENGER Extreme Thermal & Spin-Orbit Model\n🏛️ ORGANIZATION: NASA & Johns Hopkins Applied Physics Laboratory\n🔬 VARIABLES: 3:2 spin-orbit resonance temperatures (100 K to 700 K) and polar cold traps\n📚 CITATION: Vasavada et al. (1999) Icarus, 141(2), 179-193.
source.climate.temp.wms.desc=📡 SOURCE: NASA MERRA-2 Atmospheric Reanalysis (WMS Satellite)\n🏛️ ORGANIZATION: NASA Goddard Earth Sciences Data and Information Services Center\n🔬 VARIABLES: 2D surface air temperature and energy balance fluxes\n📚 CITATION: Gelaro et al. (2017) Journal of Climate, 30(14), 5419-5454.

source.climate.precip.earth.desc=📡 SOURCE: NASA GPCP v2.3 & WorldClim v2.1 Bio12 Total Precipitation\n🏛️ ORGANIZATION: NASA Goddard Space Flight Center & WorldClim\n🔬 VARIABLES: Mean annual precipitation (mm/year) and global rainbelt distributions\n📚 CITATION: Adler et al. (2018) Atmosphere, 9(4), 138.
source.climate.precip.mars.desc=📡 SOURCE: Mars Water Vapor & Surface Frost Sublimation Model\n🏛️ ORGANIZATION: ESA Mars Express (OMEGA) & NASA MRO (CRISM)\n🔬 VARIABLES: Atmospheric precipitable water vapor (pr-µm) and seasonal polar frost cycle\n📚 CITATION: Smith (2004) Icarus, 167(1), 148-165.
source.climate.precip.venus.desc=📡 SOURCE: Venus Atmospheric H₂SO₄ Virga & Desiccation Model\n🏛️ ORGANIZATION: ESA Venus Express & Pioneer Venus\n🔬 VARIABLES: Sulfuric acid cloud droplet condensation, mid-atmosphere virga, and surface drought\n📚 CITATION: Titov et al. (2018) Space Science Reviews, 214(8), 126.
source.climate.precip.moon.desc=📡 SOURCE: NASA LRO LEND Epithermal Neutron Detector (Vacuum Hydrology)\n🏛️ ORGANIZATION: NASA & Space Research Institute (IKI)\n🔬 VARIABLES: Water-ice equivalent hydrogen concentration in permanently shadowed polar craters\n📚 CITATION: Mitrofanov et al. (2010) Science, 330(6003), 483-486.
source.climate.precip.mercury.desc=📡 SOURCE: NASA MESSENGER Neutron Spectrometer Exosphere Model\n🏛️ ORGANIZATION: NASA & JHU/APL\n🔬 VARIABLES: Exospheric vacuum and water ice deposits in permanently shadowed north polar craters\n📚 CITATION: Lawrence et al. (2013) Science, 339(6117), 292-296.
source.climate.precip.wms.desc=📡 SOURCE: NASA GPM IMERG Global Precipitation Measurement (WMS Satellite)\n🏛️ ORGANIZATION: NASA GSFC & JAXA\n🔬 VARIABLES: Multi-satellite combined precipitation rates (mm/hr & mm/yr)\n📚 CITATION: Huffman et al. (2019) NASA GPM IMERG Algorithm Theoretical Basis Document.

source.climate.season.earth.desc=📡 SOURCE: WorldClim v2.1 (Bio4 Temperature Seasonality) & ECMWF ERA5\n🏛️ ORGANIZATION: European Centre for Medium-Range Weather Forecasts & WorldClim\n🔬 VARIABLES: Temperature Seasonality (standard deviation × 100) and annual thermal range\n📚 CITATION: Fick & Hijmans (2017) International Journal of Climatology, 37(12), 4302-4315.
source.climate.season.mars.desc=📡 SOURCE: Martian Orbital Eccentricity & Obliquity Insolation Model\n🏛️ ORGANIZATION: NASA JPL & LMD Paris\n🔬 VARIABLES: Solar insolation variation driven by orbital eccentricity (e=0.0934) and Ls solar longitude\n📚 CITATION: Laskar et al. (2004) Icarus, 170(2), 343-364.
source.climate.season.venus.desc=📡 SOURCE: Venus Super-Rotation & Low-Obliquity Stability Model\n🏛️ ORGANIZATION: JAXA Akatsuki & ESA Venus Express\n🔬 VARIABLES: Negligible axial tilt (3.39°) resulting in minimal seasonal amplitude and uniform heat transport\n📚 CITATION: Sanchez-Lavega et al. (2017) Space Science Reviews, 212(3), 1541-1616.
source.climate.season.moon.desc=📡 SOURCE: Lunar Diurnal Insolation Amplitude Model (Axial Tilt 1.54°)\n🏛️ ORGANIZATION: NASA GSFC\n🔬 VARIABLES: Diurnal cycle duration (29.5 Earth days) driving extreme 300 K day/night thermal swing\n📚 CITATION: Vasavada et al. (2012) JGR Planets, 117(E00H18).
source.climate.season.mercury.desc=📡 SOURCE: Mercury 3:2 Spin-Orbit Resonance & Eccentricity Model\n🏛️ ORGANIZATION: NASA & JHU/APL\n🔬 VARIABLES: Resonance creates 'hot longitudes' and severe seasonal thermal contrasts (e=0.2056)\n📚 CITATION: Margot et al. (2012) JGR Planets, 117(E00L09).
source.climate.season.wms.desc=📡 SOURCE: NASA MODIS Land Surface Temperature Thermal Amplitude (WMS)\n🏛️ ORGANIZATION: NASA Land Processes Distributed Active Archive Center (LP DAAC)\n🔬 VARIABLES: Daytime minus nighttime surface temperature amplitude over annual cycle\n📚 CITATION: Wan et al. (2015) MODIS Land Surface Temperature Products User Guide.

source.biome.earth.desc=📡 SOURCE: NASA Terra/Aqua MODIS MCD12Q1 Land Cover & Biomes\n🏛️ ORGANIZATION: NASA EOSDIS & USGS Land Processes DAAC\n🔬 VARIABLES: 17 IGBP terrestrial biome classes (tropical forest, savannas, grasslands, boreal, tundra, deserts)\n📚 CITATION: Sulla-Menashe & Friedl (2018) User Guide to Collection 6 MODIS Land Cover.
source.hydro.earth.desc=📡 SOURCE: USGS HydroSHEDS & SRTM Surface Water Body Database (SWBD)\n🏛️ ORGANIZATION: World Wildlife Fund (WWF) & USGS EROS Data Center\n🔬 VARIABLES: Continental river drainage networks, stream flow accumulation, and lake basins\n📚 CITATION: Lehner, Verdin & Jarvis (2008) HydroSHEDS Technical Documentation.

source.demo.hyde.desc=📡 SOURCE: History Database of the Global Environment (HYDE 3.4)\n🏛️ ORGANIZATION: PBL Netherlands Environmental Assessment Agency & Utrecht University\n🔬 VARIABLES: Historical population density, urban/rural ratios, cropland and grazing allocations\n🌐 RESOLUTION: 5 arc-min (~8.5 km at equator) in 2:1 equirectangular projection\n📅 TIME RANGE: 10,000 BC to 2023 AD calibrated historical time series\n📚 CITATION: Klein Goldewijk et al. (2017) Earth System Science Data, 9(2), 927-953.
source.demo.paleo.desc=📡 SOURCE: Homo Sapiens Global Expansion & Paleo-Demography Model\n🏛️ ORGANIZATION: Max Planck Institute for Evolutionary Anthropology & CalPal Database\n🔬 VARIABLES: Initial hunter-gatherer carrying capacities (people/km²), coastal migration corridors\n🌐 COVERAGE: Multiresolution H3 spatial grid calibrated to MIS 5 / MIS 4 climate (-100k to -50k BP)\n📚 CITATION: Tallavaara et al. (2015) PNAS; Henn et al. (2012) PLOS Genetics.
source.demo.cshapes.desc=📡 SOURCE: CShapes 2.0 & Centennia Historical Political Demography\n🏛️ ORGANIZATION: ETH Zürich & International Peace Research Institute Oslo (PRIO)\n🔬 VARIABLES: Historical state capitals, geopolitical borders, sovereign spheres, and regional population totals\n📚 CITATION: Schvitz et al. (2022) International Interactions, 48(1), 120-145.

source.tensor.0.glottolog.desc=📡 SOURCE: Glottolog 4.8 & World Atlas of Language Structures (WALS)\n🏛️ ORGANIZATION: Max Planck Institute for Evolutionary Anthropology (Leipzig)\n🔬 VARIABLES: Tensor 0 — Linguistic family classification (24-bit RGB IDs) & continuous dialectal distance\n🌐 COVERAGE: 8,500+ world languages and dialects mapped with genealogical trees\n📚 CITATION: Hammarström, Forkel & Haspelmath (2023) Glottolog 4.8; Dryer & Haspelmath (2013).
source.tensor.1.murdock.desc=📡 SOURCE: Murdock Ethnographic Atlas & Standard Cross-Cultural Sample (SCCS)\n🏛️ ORGANIZATION: University of Pittsburgh & Yale Human Relations Area Files (HRAF)\n🔬 VARIABLES: Tensor 1 — Kinship structures, descent rules (patrilineal, matrilineal, bilateral), and exogamy\n🌐 SAMPLE: 1,167 traditional and pre-industrial human societies\n📚 CITATION: Murdock (1967) Ethnographic Atlas; Murdock & White (1969) SCCS.
source.tensor.2.seshat.desc=📡 SOURCE: Seshat Global History Databank & Cliodynamics Project\n🏛️ ORGANIZATION: Evolution Institute & Oxford University (Cliodynamics Lab)\n🔬 VARIABLES: Tensor 2 — Collective ritual frequency, moralizing high gods, and sacred group cohesion (Asabiyyah)\n🌐 SCOPE: 400+ historical societies spanning 5,000 years of recorded history\n📚 CITATION: Turchin et al. (2018) PNAS, 115(2), E144-E151; Whitehouse et al. (2019) Nature.
source.tensor.3.centennia.desc=📡 SOURCE: Centennia Historical Atlas & CShapes Geopolitical Domains\n🏛️ ORGANIZATION: Clockwork Software & University of Essex\n🔬 VARIABLES: Tensor 3 — Sovereign territory boundaries (24-bit polity IDs), vassalage, and frontier marches\n📅 TIME RANGE: 1000 BC to 2026 AD with decadal time resolution\n📚 CITATION: Reed (2014) Centennia Historical Atlas; CShapes 2.0 (2022).
source.tensor.4.archaeoglobe.desc=📡 SOURCE: ArchaeoGLOBE Global Land-Use & Technological Transitions Project\n🏛️ ORGANIZATION: ArchaeoGLOBE Collaboration & University of Maryland\n🔬 VARIABLES: Tensor 4 — Material technology frontiers (lithic, bronze metallurgy, blast-furnace iron, steam power)\n🌐 EXTENT: 255 archaeological regions across 10,000 years of global material history\n📚 CITATION: Stephens et al. (2019) Science, 365(6456), 897-902.
source.tensor.5.orbis.desc=📡 SOURCE: Stanford ORBIS Geospatial Transportation Network & Silk Road Corridors\n🏛️ ORGANIZATION: Stanford University & UNESCO Silk Roads Programme\n🔬 VARIABLES: Tensor 5 — Multimodal commercial trade networks, friction of distance costs, and caravan hubs\n📚 CITATION: Scheidel & Meeks (2012) ORBIS Stanford; de La Vaissière (2005) Sogdian Traders.
source.tensor.6.seshat_law.desc=📡 SOURCE: Seshat Institutional Complexity & Cross-National Time-Series (CNTS)\n🏛️ ORGANIZATION: Seshat Databank & Banks International Cross-Polity Survey\n🔬 VARIABLES: Tensor 6 — Administrative hierarchy levels, written law codification, and fiscal bureaucracy\n📚 CITATION: Turchin, Currie, Turner et al. (2018) PNAS; Banks & Wilson (2020) CNTS.
source.tensor.7.anthromes.desc=📡 SOURCE: Anthromes 2.0 Global Anthropogenic Biomes & HYDE 3.4 Stress Matrix\n🏛️ ORGANIZATION: University of Maryland & PBL Netherlands\n🔬 VARIABLES: Tensor 7 — Human environmental footprint, deforestation, overgrazing, and soil depletion\n📚 CITATION: Ellis & Ramankutty (2008) Frontiers in Ecology; Ellis et al. (2010) Global Ecology.
source.tensor.8.pathogens.desc=📡 SOURCE: GADM Historical Epidemiological Memory & Vector Suitability Index\n🏛️ ORGANIZATION: Institute for Health Metrics and Evaluation (IHME) & WHO Historical Archives\n🔬 VARIABLES: Tensor 8 — Acquired pathogen immunities, zoonotic reservoirs, and epidemic susceptibility\n📚 CITATION: Dobson & Carper (1996); Hay et al. (2009) Global Malaria Distribution Atlas.

source.geo.coal.desc=📡 SOURCE: USGS Mineral Resources Data System (MRDS) & BGR Global Coal Basins\n🏛️ ORGANIZATION: United States Geological Survey & German Federal Institute for Geosciences (BGR)\n🔬 VARIABLES: Geological Tensor 0 — Bituminous coal, anthracite deposits, and lignite basins (Gt reserves)\n📚 CITATION: USGS MRDS Database (2023); BGR Energy Study Reserves (2022).
source.geo.oil.desc=📡 SOURCE: USGS World Petroleum Assessment (WPA) & BGR Crude Oil Assessment\n🏛️ ORGANIZATION: USGS Energy Resources Program & World Energy Council (WEC)\n🔬 VARIABLES: Geological Tensor 1 — Conventional and tight liquid hydrocarbon reservoirs (Gbbl)\n📚 CITATION: USGS WPA Bulletin 2201; BGR Commodity Top 50.
source.geo.gas.desc=📡 SOURCE: USGS Global Gas Assessment & Seafloor Clathrate Survey\n🏛️ ORGANIZATION: USGS & International Energy Agency (IEA)\n🔬 VARIABLES: Geological Tensor 2 — Natural gas fields, shale gas formations, and oceanic methane hydrates (Tcm)\n📚 CITATION: IEA World Energy Outlook (2023); Ruppel & Kessler (2017) Reviews of Geophysics.
source.geo.uranium.desc=📡 SOURCE: IAEA UDEPO (World Distribution of Uranium Deposits) & OECD Red Book\n🏛️ ORGANIZATION: International Atomic Energy Agency (IAEA) & Nuclear Energy Agency (OECD/NEA)\n🔬 VARIABLES: Geological Tensor 3 — Pitchblende ore grades, hydrothermal uranium veins, and fissile thorium (kt U)\n📚 CITATION: IAEA TECDOC-1843 UDEPO (2018); OECD/NEA Uranium Red Book (2022).
source.geo.helium3.desc=📡 SOURCE: NASA Lunar Prospector GRS & LRO Regolith Volatiles Survey\n🏛️ ORGANIZATION: NASA Planetary Data System & Lunar and Planetary Institute (LPI)\n🔬 VARIABLES: Geological Tensor 4 — Solar-wind implanted Helium-3 concentrations in ilmenite-rich regolith (ppb)\n📚 CITATION: Schmitt (2006) Return to the Moon; Wittenberg et al. (1986) Fusion Technology.
source.geo.iron.desc=📡 SOURCE: USGS Banded Iron Formations (BIF) & Porphyry Copper World Database\n🏛️ ORGANIZATION: United States Geological Survey (USGS Mineral Resources Program)\n🔬 VARIABLES: Geological Tensor 5 — Precambrian banded iron formations and porphyry copper/nickel complexes (Mt)\n📚 CITATION: Bekker et al. (2010) Economic Geology; Singer et al. (2008) USGS Report.
source.geo.precious.desc=📡 SOURCE: USGS Precious Metal Deposits (Au / Ag / Platinum Group Metals)\n🏛️ ORGANIZATION: USGS & World Gold Council (WGC)\n🔬 VARIABLES: Geological Tensor 6 — Orogenic gold quartz veins, epithermal silver, and Bushveld PGM intrusions (kt)\n📚 CITATION: USGS Mineral Commodity Summaries (2024); Goldfarb et al. (2001) Ore Geology Reviews.
source.geo.ree.desc=📡 SOURCE: USGS Rare Earth Elements & Global Lithium Salars Inventory\n🏛️ ORGANIZATION: USGS Critical Minerals Review & Geoscience Australia\n🔬 VARIABLES: Geological Tensor 7 — Carbonatites (bastnäsite, monazite), lithium brine salars, and pegmatites\n📚 CITATION: Bradley et al. (2017) USGS Lithium Review; Long et al. (2010) USGS REE Report.
source.geo.heat.desc=📡 SOURCE: International Heat Flow Commission (IHFC) Global Crustal Heat Flow\n🏛️ ORGANIZATION: International Union of Geodesy and Geophysics (IUGG / IHFC)\n🔬 VARIABLES: Geological Tensor 8 — Mantle heat flux, lithospheric conduction, and volcanic geothermal gradients (mW/m²)\n📚 CITATION: Davies (2013) Geochemistry Geophysics Geosystems, 14(10), 4608-4622.
source.geo.aquifers.desc=📡 SOURCE: UNESCO / BGR Worldwide Hydrogeological Mapping Assessment (WHYMAP)\n🏛️ ORGANIZATION: UNESCO International Hydrological Programme & BGR Germany\n🔬 VARIABLES: Geological Tensor 9 — Continental groundwater aquifers, fossil deep reservoirs, and recharge rates (km³)\n📚 CITATION: Margat & van der Gun (2013) UNESCO Groundwater Resources of the World; WHYMAP 2022.
