source.geo.uranium.desc=­ƒôí SOURCE: IAEA UDEPO (World Distribution of Uranium Deposits) & OECD Red Book\n­ƒÅø´©Å ORGANIZATION: International Atomic Energy Agency (IAEA) & Nuclear Energy Agency (OECD/NEA)\n­ƒö¼ VARIABLES: Geological Tensor 3 ÔÇö Pitchblende ore grades, hydrothermal uranium veins, and fissile thorium (kt U)\n­ƒôÜ CITATION: IAEA TECDOC-1843 UDEPO (2018); OECD/NEA Uranium Red Book (2022).
source.hydro.earth.desc=­ƒôí SOURCE: USGS HydroSHEDS & SRTM Surface Water Body Database (SWBD)\n­ƒÅø´©Å ORGANIZATION: World Wildlife Fund (WWF) & USGS EROS Data Center\n­ƒö¼ VARIABLES: Continental river drainage networks, stream flow accumulation, and lake basins\n­ƒôÜ CITATION: Lehner, Verdin & Jarvis (2008) HydroSHEDS Technical Documentation.
