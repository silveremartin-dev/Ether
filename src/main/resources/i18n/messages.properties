scenario.density.desc.COASTAL_MARITIME=­ƒîè Coastal & Maritime Focus: Encourages human settlement along ocean coastlines, river deltas, and maritime margins.
scenario.density.desc.EQUATORIAL_BELT=ÔÿÇ´©Å Equatorial Belt: Primary settlement concentrated around equatorial latitudes and high solar irradiance zones.
scenario.density.desc.HIGHLAND_MOUNTAIN=­ƒÅö Highland Refuges & Mountain Reliefs: Preferential densification in high valleys, mountain plateaus, and defensive elevated reliefs.
scenario.density.desc.INLAND_OASIS=­ƒî┤ Inland Basins & Oases: Settlement around endorheic depressions and accessible groundwater tables.
scenario.density.desc.RANDOM=­ƒÄ▓ Stochastic Distribution: Uniformly random population allocation across land cells.
scenario.density.desc.RIVER_VALLEYS=­ƒÅ× River Valleys & Alluvial Basins: High population concentration along major hydrographic river networks and fertile alluvial basins.
scenario.density.desc.SPARSE_NOMADIC=Ôø║ Sparse Nomadic Dispersion: Low-density pastoral population dispersed broadly across all viable biomes.
scenario.density.desc.UNBIASED_NATURAL=ÔÜû Natural Bio-Climatic Equilibrium: Pure physical model without artificial bias. Population settles strictly according to real environmental suitability (biomes, temperature, waterways, relief).
scenario.density.desc.UNIFORM=­ƒƒª Absolute Uniform Distribution: Strictly constant population density across all land cells on the H3 grid.
scenario.density.desc.URBAN_CLUSTERS=­ƒÅÖ Metropolises & Urban Clusters: Procedural emergence of multiple dense urban aggregation hubs.
