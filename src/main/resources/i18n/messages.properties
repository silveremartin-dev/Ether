planet.thermo.arid=• **Arid / Desert World** (Water {0}%) : Restricted aquifers, fauna concentrated in continental basins.\n
planet.thermo.balanced=• **Balanced Ecosystem (Earth-like)** : Complete continental water cycle, optimal forest and fauna biomass.\n
planet.thermo.header=🔬 **Thermodynamic Synthesis ({0})** :\n
planet.thermo.massive_body=• **Massive body ({0} km)** : Active plate tectonics, abundant crustal metal reserves and precious metals.
planet.thermo.no_atmosphere=• **No or extremely thin atmosphere** ({0} atm) : Liquid water impossible (sublimation). Zero rainfall, zero biomass.\n
planet.thermo.ocean=• **Ocean World** (Water {0}%) : Marine biomass hyperdominant (phytoplankton), massive freshwater reserves.\n
planet.thermo.small_body=• **Small radius body ({0} km)** : Rapid mantle cooling ➔ Reduced heat flux and industrial metals.
