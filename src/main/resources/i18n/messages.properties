source.geo.helium3.desc=­ƒôí SOURCE: NASA Lunar Prospector GRS & LRO Regolith Volatiles Survey\n­ƒÅø´©Å ORGANIZATION: NASA Planetary Data System & Lunar and Planetary Institute (LPI)\n­ƒö¼ VARIABLES: Geological Tensor 4 ÔÇö Solar-wind implanted Helium-3 concentrations in ilmenite-rich regolith (ppb)\n­ƒôÜ CITATION: Schmitt (2006) Return to the Moon; Wittenberg et al. (1986) Fusion Technology.
