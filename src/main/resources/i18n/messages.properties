planet.preset.super_earth=Super-Earth (Gaia Prime)
planet.preset.super_earth.desc=­ƒ¬É SUPER-EARTH (Gaia Prime): Massive terrestrial planet (1.5 Earth radii, 2.8 Earth masses), surface gravity 1.25g, dense atmosphere (2.2 atm), and intense tectonic/volcanic mantle convective plumes.
planet.preset.titan=Titan (Cryo-Moon)
planet.preset.titan.desc=­ƒƒá TITAN (Cryo-Moon): Massive cryogenic moon with dense nitrogen-methane atmosphere (1.5 atm, 94 K), liquid hydrocarbon lakes (methane/ethane), and water-ice bedrock mountains.
planet.preset.venus=Venus (Hesperos)
planet.preset.venus.desc=­ƒƒí VENUS (Hesperos): Runaway greenhouse hellscape with 92 atm COÔéé atmosphere, 465┬░C surface temperature, sulfuric acid clouds, active basaltic volcanism, and complete absence of liquid water.
planet.preset.water=Ocean World (Oceania)
planet.preset.water.desc=­ƒîè OCEAN WORLD (Oceania): Panthalassic water world with 98% ocean coverage, no exposed continental cratons, deep pelagic ecosystems, and exclusive dependence on marine foraging.
