source.tensor.3.centennia.desc=­ƒôí SOURCE: Centennia Historical Atlas & CShapes Geopolitical Domains\n­ƒÅø´©Å ORGANIZATION: Clockwork Software & University of Essex\n­ƒö¼ VARIABLES: Tensor 3 ÔÇö Sovereign territory boundaries (24-bit polity IDs), vassalage, and frontier marches\n­ƒôà TIME RANGE: 1000 BC to 2026 AD with decadal time resolution\n­ƒôÜ CITATION: Reed (2014) Centennia Historical Atlas; CShapes 2.0 (2022).
source.tensor.4.archaeoglobe.desc=­ƒôí SOURCE: ArchaeoGLOBE Global Land-Use & Technological Transitions Project\n­ƒÅø´©Å ORGANIZATION: ArchaeoGLOBE Collaboration & University of Maryland\n­ƒö¼ VARIABLES: Tensor 4 ÔÇö Material technology frontiers (lithic, bronze metallurgy, blast-furnace iron, steam power)\n­ƒîÉ EXTENT: 255 archaeological regions across 10,000 years of global material history\n­ƒôÜ CITATION: Stephens et al. (2019) Science, 365(6456), 897-902.
source.tensor.5.orbis.desc=­ƒôí SOURCE: Stanford ORBIS Geospatial Transportation Network & Silk Road Corridors\n­ƒÅø´©Å ORGANIZATION: Stanford University & UNESCO Silk Roads Programme\n­ƒö¼ VARIABLES: Tensor 5 ÔÇö Multimodal commercial trade networks, friction of distance costs, and caravan hubs\n­ƒôÜ CITATION: Scheidel & Meeks (2012) ORBIS Stanford; de La Vaissi├¿re (2005) Sogdian Traders.
source.tensor.6.seshat_law.desc=­ƒôí SOURCE: Seshat Institutional Complexity & Cross-National Time-Series (CNTS)\n­ƒÅø´©Å ORGANIZATION: Seshat Databank & Banks International Cross-Polity Survey\n­ƒö¼ VARIABLES: Tensor 6 ÔÇö Administrative hierarchy levels, written law codification, and fiscal bureaucracy\n­ƒôÜ CITATION: Turchin, Currie, Turner et al. (2018) PNAS; Banks & Wilson (2020) CNTS.
source.tensor.7.anthromes.desc=­ƒôí SOURCE: Anthromes 2.0 Global Anthropogenic Biomes & HYDE 3.4 Stress Matrix\n­ƒÅø´©Å ORGANIZATION: University of Maryland & PBL Netherlands\n­ƒö¼ VARIABLES: Tensor 7 ÔÇö Human environmental footprint, deforestation, overgrazing, and soil depletion\n­ƒôÜ CITATION: Ellis & Ramankutty (2008) Frontiers in Ecology; Ellis et al. (2010) Global Ecology.
