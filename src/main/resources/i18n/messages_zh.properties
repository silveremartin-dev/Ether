exec.topology.cluster.desc=将 H3 空间网格和计算任务切分并分布到网络中的集群节点。

exec.rendering.gui=🖼️ 交互式 GUI 模式 (实时 JavaFX 视觉)
exec.rendering.gui.desc=实时 2D/3D 地图渲染，带有交互控制面板和实时图表。
exec.rendering.headless=🚀 无头模式 (后台异步执行 - 高吞吐量批处理)
exec.rendering.headless.desc=关闭视觉渲染以释放 100% 的计算资源。支持快速参数扫掠与长期模拟。

