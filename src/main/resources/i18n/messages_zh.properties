planet.thermo.balanced=• **平衡生态系统 (类地)** : 完整的大陆水循环，最佳森林与陆生生物量。\n
planet.thermo.header=🔬 **热力学综合分析 ({0})** :\n
planet.thermo.massive_body=• **质量天体 ({0} km)** : 活跃的板块构造，丰富的地壳金属与贵金属储备。
planet.thermo.no_atmosphere=• **无大气层或极稀薄** ({0} atm) : 表面无法存在液态水 (升华)。无降水，零生物量。\n
planet.thermo.ocean=• **海洋世界** (水域 {0}%) : 海洋生物量极度占优 (浮游植物)，丰沛淡水储备。\n
planet.thermo.small_body=• **小半径天体 ({0} km)** : 地幔快速冷却 ➔ 较低的热通量与工业金属。\n
