leader.event.cleopatra_vii.desc=Gouvernance financière fine d'Alexandrie, préservation temporaire de la souveraineté égyptienne face à Rome.
leader.event.cleopatra_vii.name=Cléopâtre VII & Diplomatie Ptolémaïque
leader.event.confucius_axial_ethics.desc=奠定儒家德政与仁礼教化体系，规范官僚政体层级与社会协同秩序。
leader.event.confucius_axial_ethics.name=孔子与轴心时代礼义伦理
leader.event.constantine_christianization.desc=Édit de Milan, fondation de la Nouvelle Rome et christianisation institutionnelle de l'Empire.
leader.event.constantine_christianization.name=Constantin Ier & Constantinople
leader.event.cyrus_royal_road.desc=开创阿契美尼德帝国，颁布人权与善治宪章，建立帝国级皇家驿道网络。
leader.event.cyrus_royal_road.name=居鲁士大帝与波斯御道
leader.event.elizabeth_i_golden_age.desc=Règlement religieux pacificateur, victoire sur l'Invincible Armada et essor maritime anglais.
leader.event.elizabeth_i_golden_age.name=Élisabeth Ire & l'Ère Élisabéthaine
leader.event.fdr_new_deal.desc=Tennessee Valley Authority (barrages hydroélectriques), sécurité sociale et régulation keynésienne.
leader.event.fdr_new_deal.name=Franklin D. Roosevelt & le New Deal
leader.event.genghis_khan_yassa.desc=Création du plus grand empire contigu de l'histoire, Code de la Yassa, réseaux de relais postaux (Yam).
leader.event.genghis_khan_yassa.name=Gengis Khan & la Pax Mongolica
leader.event.hammurabi_code.desc=颁布首部统一成文法典并规范美索不达米亚灌溉水渠网络。
leader.event.hammurabi_code.name=巴比伦汉谟拉比
leader.event.han_wudi_silk_road.desc=Expéditions de Zhang Qian, sécurisation du corridor du Hexi et essor mondial de la Route de la Soie.
leader.event.han_wudi_silk_road.name=Empereur Wu des Han & Route de la Soie
leader.event.hannibal_barca_alpine_campaign.desc=Tactique militaire asymétrique, encerclement de Cannes et défi existentiel à la République Romaine.
leader.event.hannibal_barca_alpine_campaign.name=Hannibal Barca & Traversée des Alpes
leader.event.harun_al_rashid_house_of_wisdom.desc=Apogée abbasside de Bagdad, traduction massive des sciences grecques, indiennes et perses.
leader.event.harun_al_rashid_house_of_wisdom.name=Haroun al-Rachid & la Maison de la Sagesse
leader.event.hatshepsut_expeditions.desc=开创和平盛世，引领宏伟建筑复兴，开辟红海海上贸易航线。
leader.event.hatshepsut_expeditions.name=哈特谢普苏特与庞特远征
leader.event.jayavarman_vii_angkor.desc=Aménagement des barays géants d'Angkor, réseaux d'hôpitaux et apogée de l'Empire Khmer.
leader.event.jayavarman_vii_angkor.name=Jayavarman VII & les Réservoirs Khmers
leader.event.jesus_of_nazareth.desc=Mouvement spirituel messianique et refonte éthique axiale transformant le monde romain.
leader.event.jesus_of_nazareth.name=Jésus de Nazareth & la Fraternité Universelle
leader.event.joseph_stalin_purges.desc=Industrialisation forcée, collectivisation des terres, goulag et purges massives des élites politiques et militaires.
leader.event.joseph_stalin_purges.name=Joseph Staline & la Grande Terreur
leader.event.julius_caesar.desc=Conquête des Gaules, effondrement républicain et refonte julienne du calendrier.
leader.event.julius_caesar.name=Jules César & le Rubicon
leader.event.justinian_corpus_juris.desc=系统编纂罗马法集成《民法大全》，修建圣索菲亚大教堂，光复旧疆。
leader.event.justinian_corpus_juris.name=查士丁尼一世与《民法大全》
leader.event.kangxi_emperor.desc=Plus long règne de l'histoire chinoise, stabilisation des frontières, dictionnaire Kangxi et grands travaux fluviaux.
leader.event.kangxi_emperor.name=Empereur Kangxi & Digues du Fleuve Jaune
leader.event.kublai_khan_yuan.desc=Unification de la Chine et de la Mongolie, transfert de la capitale à Khanbaliq (Pékin), monnaie papier universelle.
leader.event.kublai_khan_yuan.name=Kubilai Khan & la Dynastie Yuan
leader.event.louis_xiv_colbertism.desc=Centralisation monarchique absolue, Canal du Midi, réseau des manufactures royales et prééminence française.
leader.event.louis_xiv_colbertism.name=Louis XIV & le Colbertisme
leader.event.mahatma_gandhi_satyagraha.desc=Doctrine de la non-violence active (Satyagraha), désobéissance civile et décolonisation de l'Inde.
leader.event.mahatma_gandhi_satyagraha.name=Mahatma Gandhi & la Marche du Sel
leader.event.mansa_musa_mali.desc=Pèlerinage légendaire au Caire, rayonnement de Tombouctou et financement d'universités coraniques.
leader.event.mansa_musa_mali.name=Mansa Moussa & l'Âge d'Or du Mali
leader.event.mao_zedong_revolution.desc=Fondation de la République Populaire, réformes agraires radicales, Grand Bond en Avant et Révolution Culturelle.
leader.event.mao_zedong_revolution.name=Mao Zedong & la Révolution Chinoise
leader.event.marcus_aurelius_stoicism.desc=Philosophie au pouvoir, résistance aux guerres marcomanes et gestion de la Peste Antonine.
leader.event.marcus_aurelius_stoicism.name=Marc Aurèle & les Pensées Stoïciennes
leader.event.mehmed_ii_constantinople.desc=Fin de l'Empire Byzantin, artillerie lourde de siège et constitution de l'Empire Ottoman universel.
leader.event.mehmed_ii_constantinople.name=Mehmed II & la Prise de Constantinople
leader.event.meiji_restoration_industrial.desc=Abolition du féodalisme des samouraïs, industrialisation accélérée et émergence du Japon moderne.
leader.event.meiji_restoration_industrial.name=Ère Meiji & Modernisation Industrielle
leader.event.mustafa_kemal_ataturk.desc=Sécularisation de la République, adoption de l'alphabet latin, droit de vote des femmes et industrialisation.
leader.event.mustafa_kemal_ataturk.name=Mustafa Kemal Atatürk & la Turquie Moderne
leader.event.napoleon_bonaparte_code.desc=Refonte juridique européenne, réorganisation administrative préfectorale et campagnes de conquête continentale.
leader.event.napoleon_bonaparte_code.name=Napoléon Ier & le Code Civil
leader.event.otto_von_bismarck_welfare.desc=Unification de l'Allemagne, diplomatie d'équilibre et premier système mondial de sécurité sociale.
leader.event.otto_von_bismarck_welfare.name=Otto von Bismarck & l'État Social
leader.event.pachacuti_inca_empire.desc=Fondation de l'Empire Inca (Tahuantinsuyu), terrasses agricoles andines et réseau de 40 000 km de routes.
leader.event.pachacuti_inca_empire.name=Pachacutec & le Qhapaq Ñan
leader.event.pericles_athenian_democracy.desc=Apogée de la démocratie athénienne, construction du Parthénon et hégémonie maritime égéenne.
leader.event.pericles_athenian_democracy.name=Périclès & l'Âge d'Or d'Athènes
leader.event.peter_the_great_westernization.desc=营建圣彼得堡，全面推行工矿业、陆海军与行政制度欧化近代化。
leader.event.peter_the_great_westernization.name=彼得大帝与欧化近代改革
leader.event.prophet_muhammad.desc=Unification des tribus arabes, pacte civique de Médine et naissance de la civilisation islamique.
leader.event.prophet_muhammad.name=Le Prophète Mahomet & la Constitution de Médine
leader.event.qin_shi_huang_unification.desc=一统六国，修筑万里长城，实行书同文、车同轨、统一度量衡与郡县制。
leader.event.qin_shi_huang_unification.name=秦始皇与大一统帝国
leader.event.ramesses_ii_monuments.desc=营建宏伟工程（阿布辛贝、培尔-拉美西斯），签订人类史上首个国际和平条约。
leader.event.ramesses_ii_monuments.name=拉美西斯二世与卡迭石和约
leader.event.shah_jahan_monuments.desc=Apogée esthétique moghol, aménagement de Shahjahanabad (Delhi) et grands réseaux d'irrigation.
leader.event.shah_jahan_monuments.name=Shah Jahan & le Taj Mahal
leader.event.shaka_zulu_tactics.desc=Révolution tactique de la corne de buffle, forge de l'ikwa et création de l'Empire Zoulou.
leader.event.shaka_zulu_tactics.name=Chaka Zulu & l'Armée Ibutho
leader.event.sui_yangdi_grand_canal.desc=Percement du plus vaste système hydraulique mondial unissant le Yangtsé et le Fleuve Jaune.
leader.event.sui_yangdi_grand_canal.name=Sui Yangdi & le Grand Canal de Chine
leader.event.suleiman_the_magnificent.desc=开创奥斯曼帝国鼎盛时期，统合编纂世俗法典，确立地中海海上优势。
leader.event.suleiman_the_magnificent.name=苏莱曼大帝与卡努恩法典
leader.event.sun_tzu_art_of_war.desc=系统化军事兵法战略、战役后勤学与全胜运筹学理论体系。
leader.event.sun_tzu_art_of_war.name=孙子与《孙子兵法》战略体系
leader.event.tang_taizong_governance.desc=Modèle universel de bureaucratie méritocratique, expansion le long de la Route de la Soie et tolérance religieuse.
leader.event.tang_taizong_governance.name=Tang Taizong & l'Ère Zhenguan
leader.event.trajan_apogee.desc=Extension maximale de l'Empire Romain (Dacie, Mésopotamie), forum et travaux publics grandioses.
leader.event.trajan_apogee.name=Trajan & l'Apogée de l'Empire
leader.event.vladimir_lenin_soviet.desc=Renversement tsariste, nationalisation de l'économie, électrification (GOELRO) et création de l'URSS.
leader.event.vladimir_lenin_soviet.name=Lénine & la Révolution d'Octobre
leader.event.winston_churchill_resistance.desc=Mobilisation industrielle totale, radar de défense aérienne et commandement des Alliés contre l'Axe.
leader.event.winston_churchill_resistance.name=Winston Churchill & la Résistance Britannique
leader.event.wu_zetian_empress.desc=Seule impératrice régnante de Chine, démocratisation des concours impériaux et mécénat bouddhique.
leader.event.wu_zetian_empress.name=Impératrice Wu Zetian & Réformes des Examens
