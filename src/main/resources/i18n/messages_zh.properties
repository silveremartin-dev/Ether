scenario.density.desc.COASTAL_MARITIME=🌊 海岸与海洋导向：优先在海岸线、三角洲和海洋边缘定居。
scenario.density.desc.EQUATORIAL_BELT=☀️ 赤道带：优先定居于赤道纬度及高日照区域。
scenario.density.desc.HIGHLAND_MOUNTAIN=🏔 高原避难所与山地地形：优先在山谷和高地高原聚集。
scenario.density.desc.INLAND_OASIS=🌴 内陆盆地与绿洲：围绕内陆洼地和易于获取的地下含水层集中。
scenario.density.desc.RANDOM=🎲 随机分布：在陆地单元格上进行均匀随机的人口分配。
scenario.density.desc.RIVER_VALLEYS=🏞 河谷与冲积盆地导向：人口高度集中于主要水系及肥沃的冲积盆地。
scenario.density.desc.SPARSE_NOMADIC=⛺ 游牧散布：游牧人口以极低密度广泛分布于所有宜居生物群系。
scenario.density.desc.UNBIASED_NATURAL=⚖ 自然生物气候平衡：纯物理模型。人口严格根据实际生态适宜度定居。
scenario.density.desc.UNIFORM=🟦 绝对均匀分布：所有 H3 单元格保持严格恒定的人口密度。
scenario.density.desc.URBAN_CLUSTERS=🏙 大都市与城市集群：程序化涌现出多个高密度城市聚集节点。
scenario.density_pattern=人口空间分布模式：
