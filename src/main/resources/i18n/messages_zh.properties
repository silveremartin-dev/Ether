epoch.desc.antiquity=古典帝国，地中海一体化，罗马和平，丝绸之路贸易。
epoch.desc.black_death=鼠疫杆菌大流行，极端人口骤减，农民实际工资冲击。
epoch.desc.bronze_age=最早的城市文明，早期冶金术，灌溉渠，文字出现。
epoch.desc.bronze_collapse=东地中海系统性崩溃，海上民族入侵，贸易中断。
epoch.desc.columbian_exchange=全球大洋贸易网络，跨大西洋农作物与病原体大交换。
epoch.desc.great_acceleration=全球碳氢化合物大规模开采，深层地下水抽取，人口爆发式增长。
epoch.desc.green_sahara=非洲湿润期，巨型乍得湖，绿色稀树草原上的游牧畜牧业。
epoch.desc.industrial_rev=蒸汽动力，煤炭开采，人口转型，化石能源体系。
epoch.desc.iron_age=广泛的铁冶炼，腓尼基与希腊地中海贸易殖民地。
epoch.desc.late_antique_ice=晚古小冰期，庄稼歉收，查士丁尼瘟疫，游牧民族大迁徙。
epoch.desc.lgm=末次盛冰期顶峰，海平面 -120 米，猛犸象草原，白令陆桥。
epoch.desc.medieval_optimum=中世纪气候异常期，宋代原始工业化，跨欧亚贸易网络。
epoch.desc.mid_century=人口趋于稳定，后化石能源转型，关键原材料循环经济。
epoch.desc.modern_baseline=当代实证卫星数据，全球贸易网络，能源转型。
epoch.desc.neolithic=新月沃土的早期农业，动物驯化，最早的定居村落。
epoch.desc.out_of_africa=早期智人跨越旧大陆的迁徙，狩猎采集部落，巨型动物群互动。
epoch.desc.sahul=跨越华莱士线，澳大利亚殖民与巨型动物群灭绝。
epoch.desc.toba=超级火山爆发，火山冬天，人口瓶颈与沿海避难所。
epoch.desc.younger_dryas=北半球突然降温，纳图夫文化广谱觅食压力。
