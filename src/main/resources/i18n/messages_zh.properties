planet.param.water_norm_info=归一化阈值：%.4f | 海平面：%,.0f 米
planet.tooltip.sea_level_meters=精确到米的海平面高度。直接输入精确的全球海平面海拔（例如：现今 0 米，末次盛冰期 -125 米）。与物理 NOAA ETOPO 基准（0 米对应 0.478）完全同步。
planet.sealevel.preset_0m=0 米 平均海平面 (现今 / 全新世)
planet.sealevel.preset_m35m=-35 米 (早全新世 / 距今10,000年)
planet.sealevel.preset_m80m=-80 米 (MIS 3 间冰段 / 距今50,000年)
planet.sealevel.preset_m125m=-125 米 (末次盛冰期 LGM / 距今20,000年)
planet.sealevel.preset_p65m=+65 米 (无冰世界 / 全球冰盖消融)
planet.preset=全局预设
planet.preset.archipelago=群岛世界
planet.preset.archipelago.desc=🏝️ 群岛世界：散布微型大陆、岛链与浅海的大洋行星。海上运输效率极高，连片耕地面积小，高度依赖航海与渔业贸易。
planet.preset.biomes=🌿 预设生物群落
planet.preset.climate=🌡️ 预设气候
planet.preset.earth=地球 (类地行星)
planet.preset.earth.desc=🌍 地球 (2026 / 现代基准)：标准类地行星，海洋覆盖率70.8%，全球平均气温15.0°C，CO₂浓度420 ppm，大气压1.0 atm，卫星遥感标定真实生物圈。
planet.preset.earth_modern=地球 (2026 / 现代)
planet.preset.earth_modern.desc=🌍 地球 (2026 / 现代人类世)：当代地球基准，海洋占比70.8%，全球均温15.0°C，420 ppm CO₂，工业全球化与遥感生态环境。
planet.preset.earth_iron=地球 (-1,000 / 早期铁器时代)
planet.preset.earth_iron.desc=⚔️ 地球 (-1,000 / 早期铁器时代)：高炉炼铁与冶铁技术普及，伐木烧炭加速森林砍伐，欧亚大陆各大古典帝国与货币经济崛起。
planet.preset.earth_bronze=地球 (-1,900 / 中青铜时代)
planet.preset.earth_bronze.desc=🏺 地球 (-1,900 / 中青铜时代)：跨大陆青铜与琥珀贸易走廊确立，早期成文法典、水利灌溉城邦与大型神庙建筑兴起。
planet.preset.earth_lh=地球 (-3,000 / 晚全新世)
planet.preset.earth_lh.desc=🏛️ 地球 (-3,000 / 晚全新世)：现代海岸线基本定型，撒哈拉逐步干旱化，尼罗河、美索不达米亚、印度河及黄河流域水利灌溉帝国崛起。
planet.preset.earth_mh=地球 (-6,000 / 绿色撒哈拉)
planet.preset.earth_mh.desc=🌴 地球 (-6,000 / 中全新世与绿色撒哈拉)：全新世大暖期与增强的非洲季风。撒哈拉呈现水网密布的草原生境与巨型乍得湖，新石器时代牧业繁荣。
planet.preset.earth_eh=地球 (-10,000 / 早全新世)
planet.preset.earth_eh.desc=🌾 地球 (-10,000 / 早全新世与农业革命)：冰后快速变暖，大陆冰盖消退与海平面上升。新月沃地野生谷物采集及早期动植物驯化发端。
planet.preset.earth_lgm=地球 (-20,000 / 末次盛冰期)
planet.preset.earth_lgm.desc=❄️ 地球 (-20,000 / 末次盛冰期极盛期)：全球平均气温较现代低5-6°C，北美与北欧覆盖厚达3公里的冰盖，海平面下降至-125米，干冷猛犸象苔原草原广布。
planet.preset.earth_lgm_onset=地球 (-25,000 / 盛冰期伊始 & 白令陆桥)
planet.preset.earth_lgm_onset.desc=🏔️ 地球 (-25,000 / 盛冰期伊始与白令陆桥)：冰期极盛期来临。海平面大幅下降(-100米)使连接西伯利亚与北美的白令陆桥显露，人类开启美洲定居之路。
planet.preset.earth_mis3=地球 (-50,000 / 同位素3期 & 萨胡尔定居)
planet.preset.earth_mis3.desc=🦘 地球 (-50,000 / 海洋同位素3期 MIS 3)：中度冰期气候，海平面较现代低-60米，华莱士线两侧巽他与萨胡尔古陆显露；人类首次跨海航行并定居澳洲大陆。
planet.preset.earth_lig=地球 (-100,000 / 末次间冰期)
planet.preset.earth_lig.desc=🌍 地球 (-100,000 / 末次间冰期 / 埃姆间冰期)：温暖间冰期（较工业前高+1至+2°C），海平面较现代高+6至+9米。绿色撒哈拉走廊畅通，早期智人走出非洲。
planet.preset.eyeball=潮汐锁定 (眼球行星)
planet.preset.eyeball.desc=👁️ 潮汐锁定行星 (眼球行星)：围绕红矮星同步自转。永久白昼面酷热炙烤，永久黑夜面酷寒冰封，仅在晨昏圈交界处存在狭窄宜居环带。
planet.preset.heightmap=📷 预设高程图
planet.preset.hydro=💧 预设水文
planet.preset.ice=冰霜世界 (博里阿斯)
planet.preset.ice.desc=🧊 冰霜世界 (博里阿斯)：深陷失控冰期雪球行星。全球性厚重冰盖，厚冰层下的低温海洋，极高反照率(0.65)，陆地植被生物量极度匮乏。
planet.preset.mars=火星 (阿瑞斯)
planet.preset.mars.desc=🔴 火星 (阿瑞斯)：极度干燥的荒漠世界，稀薄CO₂大气(0.006 atm)，巨型盾状火山(奥林匹斯山)，深邃峡谷(水手号峡谷)与极地干冰冰盖。
planet.preset.moon=月球 (塞勒涅)
planet.preset.moon.desc=⚪ 月球 (塞勒涅)：无大气陨石坑天体，富钛玄武岩月海，斜长岩高地，昼夜温差极大(-170°C至+120°C)，月壤蕴含太阳风注入的氦-3资源。
planet.preset.rainfall=🌧️ 预设降水量
planet.preset.resources=🪨 预设资源
planet.preset.seasonality=☀️ 预设季节性
planet.preset.super_earth=超级地球 (盖亚首星)
planet.preset.super_earth.desc=🪐 超级地球 (盖亚首星)：大质量类地行星(1.5地球半径，2.8地球质量)，地表重力1.25g，浓密大气(2.2 atm)，剧烈的地幔对流与火山活动。
planet.preset.titan=泰坦 (冰冻卫星)
planet.preset.titan.desc=🟠 泰坦 (冰冻卫星)：大质量低温卫星，浓厚氮气-甲烷大气(1.5 atm, 94 K)，液态烃类湖泊(甲烷/乙烷)与坚硬水冰岩石山脉。
planet.preset.venus=金星 (赫斯珀洛斯)
planet.preset.venus.desc=🟡 金星 (赫斯珀洛斯)：失控温室效应炼狱，92 atm超临界CO₂大气，地表温度465°C，浓硫酸云层，活跃玄武岩火山，地表无任何液态水。
planet.preset.water=海洋世界 (大洋洲)
planet.preset.water.desc=🌊 海洋世界 (大洋洲)：全大洋水行星，海洋覆盖率98%，无出露大陆克拉通，深海远洋生态系统占主导，人类完全依赖海洋渔猎采集。

source.topo.earth.desc=📡 数据来源：NOAA ETOPO2022 全球地形与 USGS GMTED2010\n🏛️ 负责机构：美国国家海洋和大气管理局 (NOAA) 与美国地质调查局 (USGS)\n🔬 物理变量：陆地高程与海洋水深联合栅格 (-11,000米 至 +8,848米)\n🌐 空间分辨率：1角分全球高程矩阵，严格对齐海平面基准 (0米 = 0.478)\n📚 文献引用：NOAA NCEI (2022) ETOPO 2022 15 Arc-Second Global Relief Model.
source.topo.mars.desc=📡 数据来源：NASA 火星全球勘测者 MOLA 与 USGS 天体地质学 DEM\n🏛️ 负责机构：NASA 喷气推进实验室 (JPL) 与 USGS 天体地质科学中心\n🔬 物理变量：基于火星 6.1 mbar 气压椭球面基准的地表起伏高程\n🌐 覆盖范围：100% 全球激光测高拼接图\n📚 文献引用：Smith et al. (2001) Science, 292(5525), 2307-2316.
source.topo.venus.desc=📡 数据来源：NASA 麦哲伦号合成孔径雷达 (SAR) 测高数据\n🏛️ 负责机构：NASA JPL 与 欧洲航天局 (金星快车号)\n🔬 物理变量：穿透厚重云层的雷达表面高程、介电常数及火山冕状结构\n📚 文献引用：Saunders et al. (1992) Journal of Geophysical Research, 97(E8), 13067.
source.topo.moon.desc=📡 数据来源：NASA 月球勘测轨道飞行器 (LRO) LOLA 激光测高\n🏛️ 负责机构：NASA 戈达德太空飞行中心 (GSFC) 与月球与行星研究所 (LPI)\n🔬 物理变量：月表地形、撞击坑形态及月海玄武岩高程\n📚 文献引用：Smith et al. (2010) Space Science Reviews, 150(1), 209-241.
source.topo.mercury.desc=📡 数据来源：NASA 信使号 MLA 激光测高仪与 MDIS 拼接图\n🏛️ 负责机构：NASA 与 约翰斯·霍普金斯大学应用物理实验室 (JHU/APL)\n🔬 物理变量：地表起伏、瓣状断崖及北极永久阴影撞击盆地\n📚 文献引用：Zuber et al. (2012) Science, 336(6078), 217-220.

source.climate.temp.earth.desc=📡 数据来源：ECMWF ERA5 大气再分析与 WorldClim v2.1 (Bio1)\n🏛️ 负责机构：欧洲中期天气预报中心 (ECMWF) 与 NASA\n🔬 物理变量：年平均 2米 地表气温 (°C) 与季节性温差\n🌐 空间分辨率：0.1° (~11 km) 2:1 等距柱状投影栅格\n📚 文献引用：Hersbach et al. (2020) QJRMS; Fick & Hijmans (2017) Int. J. Climatol.
source.climate.temp.mars.desc=📡 数据来源：火星全球勘测者 TES 热辐射仪与 MCD 6.1 数据库\n🏛️ 负责机构：NASA JPL、ESA 与 法国动力气象实验室 (CNRS/LMD)\n🔬 物理变量：火星表面辐射平衡温度、昼夜温度循环及 CO₂ 凝结冰冻线\n📚 文献引用：Forget et al. (1999) JGR Planets; Millour et al. (2023) MCD 6.1 Documentation.
source.climate.temp.venus.desc=📡 数据来源：金星快车号 VIRTIS 热成像光谱仪与麦哲伦模型\n🏛️ 负责机构：欧洲航天局 (ESA) 与 NASA JPL\n🔬 物理变量：465°C 超临界 CO₂ 表面高温及高程绝热递减率\n📚 文献引用：Svedhem et al. (2007) Nature, 450, 637-641.
source.climate.temp.moon.desc=📡 数据来源：NASA LRO Diviner 月球辐射计实验\n🏛️ 负责机构：NASA GSFC 与 加州大学洛杉矶分校 (UCLA)\n🔬 物理变量：月表昼夜极端温度 (40 K 至 390 K) 及极区永久冷陷阱\n📚 文献引用：Paige et al. (2010) Science, 330(6003), 479-482.
source.climate.temp.mercury.desc=📡 数据来源：NASA 信使号极端热环境与自旋轨道共振模型\n🏛️ 负责机构：NASA 与 约翰斯·霍普金斯大学应用物理实验室\n🔬 物理变量：3:2 自旋轨道共振热分布 (100 K 至 700 K) 及极地冷阱\n📚 文献引用：Vasavada et al. (1999) Icarus, 141(2), 179-193.
source.climate.temp.wms.desc=📡 数据来源：NASA MERRA-2 大气再分析数据集 (WMS 卫星源)\n🏛️ 负责机构：NASA 戈达德地球科学数据与信息服务中心\n🔬 物理变量：2D 地表空气温度与辐射能量通量平衡\n📚 文献引用：Gelaro et al. (2017) Journal of Climate, 30(14), 5419-5454.

source.climate.precip.earth.desc=📡 数据来源：NASA GPCP v2.3 与 WorldClim v2.1 Bio12 年总降水量\n🏛️ 负责机构：NASA 戈达德太空飞行中心与 WorldClim\n🔬 物理变量：年均降水量 (mm/年) 与赤道辐合带雨带分布\n📚 文献引用：Adler et al. (2018) Atmosphere, 9(4), 138.
source.climate.precip.mars.desc=📡 数据来源：火星水汽含量与地表霜华升华模型\n🏛️ 负责机构：ESA 火星快车号 (OMEGA) 与 NASA MRO (CRISM)\n🔬 物理变量：大气可降水水汽柱浓度 (pr-µm) 与季节性极冠干冰/水冰循环\n📚 文献引用：Smith (2004) Icarus, 167(1), 148-165.
source.climate.precip.venus.desc=📡 数据来源：金星大气 H₂SO₄ 幡状云 (Virga) 与极度干燥模型\n🏛️ 负责机构：ESA 金星快车号 与 先驱者金星号\n🔬 物理变量：硫酸水滴凝结、中层大气云蒸发及地表彻底无降水干燥\n📚 文献引用：Titov et al. (2018) Space Science Reviews, 214(8), 126.
source.climate.precip.moon.desc=📡 数据来源：NASA LRO LEND 超热中子探测器 (真空水文)\n🏛️ 负责机构：NASA 与 俄罗斯空间研究所 (IKI)\n🔬 物理变量：极地永久阴影陨坑中的水冰等效氢丰度分布\n📚 文献引用：Mitrofanov et al. (2010) Science, 330(6003), 483-486.
source.climate.precip.mercury.desc=📡 数据来源：NASA 信使号中子光谱仪外逸层模型\n🏛️ 负责机构：NASA 与 JHU/APL\n🔬 物理变量：外逸层真空环境与北极阴影坑中保存的水冰沉积分量\n📚 文献引用：Lawrence et al. (2013) Science, 339(6117), 292-296.
source.climate.precip.wms.desc=📡 数据来源：NASA GPM IMERG 全球降水测量 (WMS 卫星源)\n🏛️ 负责机构：NASA GSFC 与 日本宇宙航空研究开发机构 (JAXA)\n🔬 物理变量：多卫星融合高精度降水率 (mm/小时 与 mm/年)\n📚 文献引用：Huffman et al. (2019) NASA GPM IMERG Theoretical Basis Document.

source.climate.season.earth.desc=📡 数据来源：WorldClim v2.1 (Bio4 温度季节性) 与 ECMWF ERA5\n🏛️ 负责机构：欧洲中期天气预报中心与 WorldClim\n🔬 物理变量：年均温度季节性方差 (标准差 × 100) 与夏冬年温差幅度\n📚 文献引用：Fick & Hijmans (2017) International Journal of Climatology, 37(12), 4302-4315.
source.climate.season.mars.desc=📡 数据来源：火星轨道偏心率与黄赤交角辐射模型\n🏛️ 负责机构：NASA JPL 与 巴黎动力气象实验室\n🔬 物理变量：由高轨道偏心率 (e=0.0934) 与太阳黄经 Ls 驱动的季节性日照起伏\n📚 文献引用：Laskar et al. (2004) Icarus, 170(2), 343-364.
source.climate.season.venus.desc=📡 数据来源：金星大气超自转与低倾角稳定性模型\n🏛️ 负责机构：JAXA 晓号 与 ESA 金星快车号\n🔬 物理变量：极低轴倾角 (3.39°) 导致地表季节性变化微乎其微\n📚 文献引用：Sanchez-Lavega et al. (2017) Space Science Reviews, 212(3), 1541-1616.
source.climate.season.moon.desc=📡 数据来源：月球昼夜热振幅模型 (自转倾角 1.54°)\n🏛️ 负责机构：NASA GSFC\n🔬 物理变量：29.5地球日的长周期昼夜循环造成地表 300 K 剧烈热胀冷缩\n📚 文献引用：Vasavada et al. (2012) JGR Planets, 117(E00H18).
source.climate.season.mercury.desc=📡 数据来源：水星 3:2 自旋轨道共振与偏心率模型\n🏛️ 负责机构：NASA 与 JHU/APL\n🔬 物理变量：自旋轨道共振产生特征热经线与强烈的周期性温差 (e=0.2056)\n📚 文献引用：Margot et al. (2012) JGR Planets, 117(E00L09).
source.climate.season.wms.desc=📡 数据来源：NASA MODIS 地表温度热振幅 (WMS 卫星源)\n🏛️ 负责机构：NASA 陆地过程分布式数据中心 (LP DAAC)\n🔬 物理变量：全年周期内白天与夜间地表真实红外辐射温差振幅\n📚 文献引用：Wan et al. (2015) MODIS Land Surface Temperature Products Guide.

source.biome.earth.desc=📡 数据来源：NASA Terra/Aqua MODIS MCD12Q1 土地覆盖与生物群落\n🏛️ 负责机构：NASA EOSDIS 与 USGS 陆地过程数据中心\n🔬 物理变量：17类 IGBP 全球植被生态分类 (热带雨林、草原、冻原、荒漠等)\n📚 文献引用：Sulla-Menashe & Friedl (2018) User Guide to MODIS Land Cover.
source.hydro.earth.desc=📡 数据来源：USGS HydroSHEDS 水系与 SRTM SWBD 地表水体库\n🏛️ 负责机构：世界自然基金会 (WWF) 与 USGS EROS 数据中心\n🔬 物理变量：大陆河流流域水系、径流汇流累积量与湖泊分布\n📚 文献引用：Lehner, Verdin & Jarvis (2008) HydroSHEDS Technical Documentation.

source.demo.hyde.desc=📡 数据来源：全球环境历史数据库 (HYDE 3.4)\n🏛️ 负责机构：荷兰环境评估署 (PBL) 与 乌得勒支大学\n🔬 物理变量：历史人口密度、城乡分布比例、耕地与牧场空间分配\n🌐 空间分辨率：5角分 (~8.5 km) 2:1 等距柱状投影\n📅 时间跨度：公元前10,000年 至 公元2023年 校准历史时间序列\n📚 文献引用：Klein Goldewijk et al. (2017) Earth System Science Data, 9(2), 927-953.
source.demo.paleo.desc=📡 数据来源：早期智人全球扩张与古人口学模型\n🏛️ 负责机构：马克斯·普朗克进化人类学研究所 与 CalPal 数据库\n🔬 物理变量：旧石器狩猎采集初始环境容纳量 (人/km²)、沿海迁徙走廊\n🌐 空间网格：校准至 MIS 5 / MIS 4 气候的多分辨率 H3 网格 (-100k 至 -50k BP)\n📚 文献引用：Tallavaara et al. (2015) PNAS; Henn et al. (2012) PLOS Genetics.
source.demo.cshapes.desc=📡 数据来源：CShapes 2.0 与 Centennia 历史政治人口数据集\n🏛️ 负责机构：苏黎世联邦理工学院 (ETH) 与 奥斯陆国际和平研究所 (PRIO)\n🔬 物理变量：历史政权首都分布、主权政治边界与区域人口统计\n📚 文献引用：Schvitz et al. (2022) International Interactions, 48(1), 120-145.

source.tensor.0.glottolog.desc=📡 数据来源：Glottolog 4.8 与 全球语言结构地图集 (WALS)\n🏛️ 负责机构：马克斯·普朗克进化人类学研究所 (莱比锡)\n🔬 物理变量：张量 0 — 语言谱系分类 (24位 RGB 标识符) 与连续方言距离梯度\n🌐 覆盖范围：8,500+ 种世界语言及方言树状图谱\n📚 文献引用：Hammarström, Forkel & Haspelmath (2023) Glottolog 4.8; Dryer & Haspelmath (2013).
source.tensor.1.murdock.desc=📡 数据来源：默多克民族志地图集 (Murdock) 与 标准跨文化样本 (SCCS)\n🏛️ 负责机构：匹兹堡大学 与 耶鲁大学人类关系区域档案 (HRAF)\n🔬 物理变量：张量 1 — 亲属组织制度、继嗣规则 (父系、母系、双系) 与外婚制\n🌐 样本规模：1,167 个传统及前工业人类社会样本\n📚 文献引用：Murdock (1967) Ethnographic Atlas; Murdock & White (1969) SCCS.
source.tensor.2.seshat.desc=📡 数据来源：Seshat 全球历史数据库与历史动力学项目\n🏛️ 负责机构：进化研究所 与 牛津大学 (历史动力学实验室)\n🔬 物理变量：张量 2 — 集体仪式频率、道德化至高神与群体向心力 (Asabiyyah)\n🌐 覆盖跨度：涵盖人类 5,000 年文明史的 400+ 个历史政权与社会\n📚 文献引用：Turchin et al. (2018) PNAS, 115(2), E144-E151; Whitehouse et al. (2019) Nature.
source.tensor.3.centennia.desc=📡 数据来源：Centennia 历史地图集与 CShapes 地缘政治版图\n🏛️ 负责机构：Clockwork Software 与 埃塞克斯大学\n🔬 物理变量：张量 3 — 政治主权边界 (24位政体 ID)、附庸秩序与边境前哨\n📅 时间跨度：公元前1000年 至 公元2026年 逐十年高精度时间序列\n📚 文献引用：Reed (2014) Centennia Historical Atlas; CShapes 2.0 (2022).
source.tensor.4.archaeoglobe.desc=📡 数据来源：ArchaeoGLOBE 土地利用与技术转型全球考古项目\n🏛️ 负责机构：ArchaeoGLOBE 合作组织 与 马里兰大学\n🔬 物理变量：张量 4 — 物质技术前沿 (石器时代、青铜铸造、高炉炼铁、蒸汽动力)\n🌐 空间范围：覆盖全球文明史一万年物质转型的 255 个考古分区\n📚 文献引用：Stephens et al. (2019) Science, 365(6456), 897-902.
source.tensor.5.orbis.desc=📡 数据来源：斯坦福 ORBIS 空间交通网络与丝绸之路走廊\n🏛️ 负责机构：斯坦福大学 与 联合国教科文组织 (UNESCO) 丝绸之路项目\n🔬 物理变量：张量 5 — 多式联运商贸网络、运输距离阻力成本与商队枢纽\n📚 文献引用：Scheidel & Meeks (2012) ORBIS Stanford; de La Vaissière (2005) 粟特商人史.
source.tensor.6.seshat_law.desc=📡 数据来源：Seshat 制度复杂性与跨国时间序列数据库 (CNTS)\n🏛️ 负责机构：Seshat 数据库 与 Banks 国际政体调查组织\n🔬 物理变量：张量 6 — 行政官僚层级深度、成文法律法典化与财政税收体制\n📚 文献引用：Turchin, Currie, Turner et al. (2018) PNAS; Banks & Wilson (2020) CNTS.
source.tensor.7.anthromes.desc=📡 数据来源：Anthromes 2.0 人为生物群落与 HYDE 3.4 生态压力矩阵\n🏛️ 负责机构：马里兰大学 与 荷兰环境评估署 (PBL)\n🔬 物理变量：张量 7 — 人类生态足迹强度、森林砍伐率、过度放牧与土壤退化\n📚 文献引用：Ellis & Ramankutty (2008) Frontiers in Ecology; Ellis et al. (2010) Global Ecology.
source.tensor.8.pathogens.desc=📡 数据来源：GADM 历史流行病记忆库与世卫组织 (WHO) 媒介适宜度指数\n🏛️ 负责机构：健康指标与评估研究所 (IHME) 与 WHO 历史档案馆\n🔬 物理变量：张量 8 — 获得性病原体免疫屏障、人畜共患病自然疫源地与易感性\n📚 文献引用：Dobson & Carper (1996); Hay et al. (2009) Global Malaria Distribution Atlas.

source.geo.coal.desc=📡 数据来源：USGS 矿产资源数据系统 (MRDS) 与 BGR 全球煤田数据库\n🏛️ 负责机构：美国地质调查局 与 德国联邦地球科学与自然资源研究所 (BGR)\n🔬 物理变量：地质张量 0 — 烟煤盆地、无烟煤矿层与褐煤矿床 (储量 Gt)\n📚 文献引用：USGS MRDS Database (2023); BGR Energy Study Reserves (2022).
source.geo.oil.desc=📡 数据来源：USGS 全球石油评估 (WPA) 与 BGR 原油储量评估\n🏛️ 负责机构：USGS 能源资源计划 与 世界能源理事会 (WEC)\n🔬 物理变量：地质张量 1 — 常规与非常规液态烃类储层分布 (Gbbl)\n📚 文献引用：USGS WPA Bulletin 2201; BGR Commodity Top 50.
source.geo.gas.desc=📡 数据来源：USGS 全球天然气评估与海底甲烷水合物勘探数据库\n🏛️ 负责机构：USGS 与 国际能源署 (IEA)\n🔬 物理变量：地质张量 2 — 常规天然气田、页岩气藏与海底可燃冰矿藏 (Tcm)\n📚 文献引用：IEA World Energy Outlook (2023); Ruppel & Kessler (2017) Reviews of Geophysics.
source.geo.uranium.desc=📡 数据来源：国际原子能机构 UDEPO 数据库与 OECD 铀红皮书\n🏛️ 负责机构：国际原子能机构 (IAEA) 与 经合组织核能署 (OECD/NEA)\n🔬 物理变量：地质张量 3 — 沥青铀矿品位、热液铀矿脉及可裂变钍矿床 (kt U)\n📚 文献引用：IAEA TECDOC-1843 UDEPO (2018); OECD/NEA Uranium Red Book (2022).
source.geo.helium3.desc=📡 数据来源：NASA 月球探勘者伽马射线谱仪与 LRO 月壤挥发分勘测\n🏛️ 负责机构：NASA 行星数据系统 与 月球与行星研究所 (LPI)\n🔬 物理变量：地质张量 4 — 太阳风注入富钛钛铁矿月壤中的氦-3资源丰度 (ppb)\n📚 文献引用：Schmitt (2006) Return to the Moon; Wittenberg et al. (1986) Fusion Technology.
source.geo.iron.desc=📡 数据来源：条带状铁建造 (BIF) 与 斑岩铜矿全球数据库\n🏛️ 负责机构：美国地质调查局 (USGS 矿产资源计划)\n🔬 物理变量：地质张量 5 — 前寒武纪条带状铁矿建造与斑岩型铜镍矿床 (Mt)\n📚 文献引用：Bekker et al. (2010) Economic Geology; Singer et al. (2008) USGS Report.
source.geo.precious.desc=📡 数据来源：USGS 贵金属矿床数据集 (金、银、铂族金属 PGM)\n🏛️ 负责机构：USGS 与 世界黄金协会 (WGC)\n🔬 物理变量：地质张量 6 — 造山带石英脉型金矿、浅成低温热液银矿及布什维尔德铂族杂岩 (kt)\n📚 文献引用：USGS Mineral Commodity Summaries (2024); Goldfarb et al. (2001) Ore Geology Reviews.
source.geo.ree.desc=📡 数据来源：USGS 稀土元素矿床与全球锂盐湖矿产名录\n🏛️ 负责机构：USGS 关键矿产评估部门 与 澳大利亚地球科学局\n🔬 物理变量：地质张量 7 — 碳酸三体岩矿 (氟碳铈矿/独居石)、锂盐湖卤水及锂辉石伟晶岩\n📚 文献引用：Bradley et al. (2017) USGS Lithium Review; Long et al. (2010) USGS REE Report.
source.geo.heat.desc=📡 数据来源：国际热流委员会 (IHFC / IUGG) 全球地壳热流图\n🏛️ 负责机构：国际大地测量学与地球物理学联合会 (IUGG / IHFC)\n🔬 物理变量：地质张量 8 — 地幔热流、岩石圈热传导与火山地热梯度 (mW/m²)\n📚 文献引用：Davies (2013) Geochemistry Geophysics Geosystems, 14(10), 4608-4622.
source.geo.aquifers.desc=📡 数据来源：联合国教科文组织 WHYMAP 全球水文地质评估图\n🏛️ 负责机构：UNESCO 国际水文计划 与 德国地质调查局 (BGR)\n🔬 物理变量：地质张量 9 — 大陆区域性地下蓄水层、深层化石水库与年补给率 (km³)\n📚 文献引用：Margat & van der Gun (2013) UNESCO Groundwater Resources of the World; WHYMAP 2022.
