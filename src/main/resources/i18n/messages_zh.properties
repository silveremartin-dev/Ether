scenario.tooltip.random_events=🎲 随机与随机性事件管理\n• 若启用：引擎将生成由剧本随机种子驱动的涌现性危机（饥荒、瘟疫、干旱、火山爆发）。\n• 若禁用：不会自发产生任何随机事件（纯确定性历史轨迹）。
