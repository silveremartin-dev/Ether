exec.hardware.off=🔧 纯软件 CPU 渲染 (-Dprism.order=sw)
exec.hardware.off.desc=完全禁用硬件图形加速，以防止闪烁或画面异常。

exec.topology.local=🏢 本地单机模式 (主机 CPU/内存)
exec.topology.local.desc=模拟完全在本地计算机上运行。
