resource.tensor.3.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 10¹² m³ | White (255) = 5.0 10¹² m³ (WEP / BGR Germany)
resource.tensor.3.source.baseline=WEP / BGR Natural Gas Fields (Earth Baseline)
resource.tensor.4.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 ppm | White (255) = 1,000 ppm U (IAEA UDEPO / NFCIS)
resource.tensor.4.source.baseline=IAEA UDEPO / NFCIS Uranium Database (Earth Baseline)
resource.tensor.5.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 ppb | White (255) = 100 ppb He-3 (NASA PDS / Lunar Prospector)
resource.tensor.5.source.baseline=NASA PDS / LPI Lunar Regolith (Planetary Baseline)
resource.tensor.6.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 Gt | White (255) = 5.0 Gt (USGS Mineral Resources / BIF)
resource.tensor.6.source.baseline=USGS Mineral Resources BIF Iron & Copper (Earth Baseline)
resource.tensor.7.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 Mt | White (255) = 5.0 Mt (USGS REE / Salars & Carbonatites)
resource.tensor.7.source.baseline=USGS REE & Lithium Salars (Earth Baseline)
resource.tensor.8.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 20 mW/m² | White (255) = 250 mW/m² (IHFC / Davies 2013)
resource.tensor.8.source.baseline=IHFC / Davies 2013 Global Heat Flow (Earth Baseline)
resource.tensor.9.format=Grayscale PNG (equirectangular 2:1):\n  Black (0) = 0 10³ km³ | White (255) = 5.0 10³ km³ (UNESCO / WHYMAP)
resource.tensor.9.source.baseline=UNESCO / WHYMAP Global Groundwater (Earth Baseline)
resource.tensor.1.param1.tt=Controls global abundance and average thickness of coal seams in sedimentary basins (Gt).
resource.tensor.1.param2.tt=Minimum percentage of paleolithic wetland vegetation required for peat accumulation.
resource.tensor.1.param3=Coalification Rank (Anthracitization)
resource.tensor.1.param3.tt=Thermal metamorphism rank (%Ro vitrinite). 0=Lignite, 0.5=Bituminous, 1.0=Pure anthracite.
resource.tensor.1.param4=Sedimentary Cover Thickness
resource.tensor.1.param4.tt=Lithostatic burial depth in paralic basins promoting sedimentary compaction (km).
resource.tensor.2.param1.tt=Total volume of liquid hydrocarbons trapped in subterranean reservoirs (Gt).
resource.tensor.2.param2.tt=Total Organic Carbon (TOC) rate deposited in marine shales under anoxic conditions.
resource.tensor.2.param3=Anticlinal Trap & Fault Density
resource.tensor.2.param3.tt=Frequency of folded tectonic deformations and salt domes halting oil migration.
resource.tensor.2.param4=Oil Window Temperature
resource.tensor.2.param4.tt=Natural pyrolysis temperature range (60°C-180°C) converting kerogen to crude oil.
resource.tensor.3.param1.tt=Total volume of conventional and unconventional natural gas stored under pressure (10¹² m³).
resource.tensor.3.param2.tt=Proportion of deep thermal cracking gas compared to surface biogenic gas.
resource.tensor.3.param3=Cratonic Reservoir Depth
resource.tensor.3.param3.tt=Depth of sandstone and carbonate reservoir formations impacting gas retention (km).
resource.tensor.3.param4=Caprock Impermeability
resource.tensor.3.param4.tt=Sealing capacity of evaporite and shale layers preventing gas leakage to the surface.
resource.tensor.4.param1.tt=Average Uranium concentration in magmatic crust and fertile granites (ppm).
resource.tensor.4.param2.tt=Hydrothermal fluid circulation leaching and precipitating pitchblende (UO₂) in veins.
resource.tensor.4.param3=Thorium/Uranium Mass Ratio
resource.tensor.4.param3.tt=Natural Th²³²/U²³⁸ isotopic ratio. Higher ratio favors Thorium mineralizations.
resource.tensor.4.param4=Redox Fronts & Unconformities
resource.tensor.4.param4.tt=Intensity of reduction-oxidation traps at Proterozoic unconformities (Athabasca type).
resource.tensor.5.param1.tt=Density of Helium-3 trapped in the upper regolith layer by solar wind (ppb).
resource.tensor.5.param2.tt=Percentage of ilmenite in planetary rock, preferentially retaining He-3 ions.
resource.tensor.5.param3=Solar Wind Ionic Flux
resource.tensor.5.param3.tt=Intensity of solar wind proton/alpha bombardment (inverse of magnetic field).
resource.tensor.5.param4=Crater Regolith Gardening Depth
resource.tensor.5.param4.tt=Depth of regolith overturn by meteorite micro-impacts burying He-3 (m).
resource.tensor.6.param1.tt=Total mass of Banded Iron Formations (BIF) and porphyry copper deposits (Gt).
resource.tensor.6.param2.tt=Intensity of volcanic arc activity and magmatic intrusions injecting hydrothermal copper.
resource.tensor.6.param3=Archean BIF Precipitation (O₂ Index)
resource.tensor.6.param3.tt=Great Oxidation Event (GOE) precipitating dissolved oceanic iron as hematite.
resource.tensor.6.param4=Porphyry Copper Grade (% Cu)
resource.tensor.6.param4.tt=Average copper grade of raw ore (% Cu by mass). Giant porphyries: 0.4%-2.5% Cu.
resource.tensor.7.param1.tt=Volume of Rare Earths (Nd, Dy, Y), Lithium, Gold, and Platinum in Megatons (Mt).
resource.tensor.7.param2.tt=Evaporative enrichment of Lithium brines (Li⁺) in continental salars.
resource.tensor.7.param3=Carbonatite & Alkaline Intrusions
resource.tensor.7.param3.tt=Frequency of carbonatite dykes and alkaline rocks concentrating monazite and bastnäsite.
resource.tensor.7.param4=Spodumene Pegmatite Grade (% Li₂O)
resource.tensor.7.param4.tt=Hard-rock lithium concentration in spodumene pegmatite veins (% Li₂O).
resource.tensor.8.param1.tt=Average conductive heat dissipation through planetary crust in mW/m².
resource.tensor.8.param2.tt=Thermal anomaly multiplier at divergent plate boundaries and mantle plumes.
resource.tensor.8.param3=Lithospheric Craton Thickness
resource.tensor.8.param3.tt=Thickness of continental cratonic root insulating surface heat flow (km).
resource.tensor.8.param4=Crustal Radiogenic Heat
resource.tensor.8.param4.tt=Heat production by radioactive decay of K, U, Th in upper crust (µW/m³).
resource.tensor.9.param1.tt=Total volume of groundwater stored in water tables and fossil aquifers (10³ km³).
resource.tensor.9.param2.tt=Aquifer rock permeability governing recharge rate and gravity flow speed.
resource.tensor.9.param3=Reservoir Rock Porosity (%)
resource.tensor.9.param3.tt=Percentage of pore void space in sandstones and limestones holding water under pressure.
resource.tensor.9.param4=Permafrost / Cryosphere Depth
resource.tensor.9.param4.tt=Thickness of permanently frozen ground (permafrost) sealing sub-permafrost aquifers (m).
