scenario.density.desc.COASTAL_MARITIME=🌊 Coastal & Maritime Focus: Encourages human settlement along ocean coastlines, river deltas, and maritime margins.
scenario.density.desc.EQUATORIAL_BELT=☀️ Equatorial Belt: Primary settlement concentrated around equatorial latitudes and high solar irradiance zones.
scenario.density.desc.HIGHLAND_MOUNTAIN=🏔 Highland Refuges & Mountain Reliefs: Preferential densification in high valleys, mountain plateaus, and defensive elevated reliefs.
scenario.density.desc.INLAND_OASIS=🌴 Inland Basins & Oases: Settlement around endorheic depressions and accessible groundwater tables.
scenario.density.desc.RANDOM=🎲 Stochastic Distribution: Uniformly random population allocation across land cells.
scenario.density.desc.RIVER_VALLEYS=🏞 River Valleys & Alluvial Basins: High population concentration along major hydrographic river networks and fertile alluvial basins.
scenario.density.desc.SPARSE_NOMADIC=⛺ Sparse Nomadic Dispersion: Low-density pastoral population dispersed broadly across all viable biomes.
scenario.density.desc.UNBIASED_NATURAL=⚖ Natural Bio-Climatic Equilibrium: Pure physical model without artificial bias. Population settles strictly according to real environmental suitability (biomes, temperature, waterways, relief).
scenario.density.desc.UNIFORM=🟦 Absolute Uniform Distribution: Strictly constant population density across all land cells on the H3 grid.
scenario.density.desc.URBAN_CLUSTERS=🏙 Metropolises & Urban Clusters: Procedural emergence of multiple dense urban aggregation hubs.
