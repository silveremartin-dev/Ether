exec.topology.local.desc=La simulation s'exécute intégralement sur l'ordinateur local.
exec.topology.cluster=🌐 Mode Distribué en Cluster (Nœuds Multi-Machines gRPC/TCP)
exec.topology.cluster.desc=Répartit la grille H3 et les calculs sur plusieurs machines connectées sur le réseau local ou cloud.

