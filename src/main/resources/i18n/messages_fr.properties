exec.rendering.headless=🚀 Mode Headless (Exécution Asynchrone Background - High Throughput Batch)
exec.rendering.headless.desc=Désactive le rendu visuel pour libérer 100% des ressources processeur. Permet des balayages de paramètres et des simulations multi-millénaires très rapides.

