scenario.tooltip.multi_rate_ticking=⚡ BÉNÉFICE : +30% de débit en exécutant la circulation thermohaline et l'inertie fluide à sous-fréquence.\n⚠️ IMPACT PHYSIQUE : Aliasing temporel potentiel lors d'événements atmosphériques ultra-rapides.
scenario.tooltip.ocean_macro_aggregation=⚡ BÉNÉFICE : +25% à +35% de TPS en regroupant les cellules d'eau profonde.\n⚠️ IMPACT PHYSIQUE : Lissage des micro-courants abyssaux sans impact sur les civilisations terrestres.
