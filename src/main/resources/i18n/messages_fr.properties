godmode.dialog.extinction_desc=Êtes-vous certain de vouloir éliminer 50% de la population mondiale ? Cette intervention sera enregistrée de façon irréversible dans le journal d'audit du scénario.
godmode.dialog.extinction_header=⚠️ Action Destructive en Mode Dieu
godmode.dialog.extinction_title=Confirmation d'Extinction Massive
godmode.event.alien_contact=Signal Radio Exogène Extraterrestre
godmode.event.alien_contact.desc=🛸 Découverte d'un signal intelligent exogène unifiant l'humanité et stimulant la recherche scientifique.
godmode.event.biodiversity_collapse=Effondrement de la Chaîne Trophique & Pollinisateurs
godmode.event.biodiversity_collapse.desc=🦋 Disparition massive des pollinisateurs et chute drastique de la biomasse sauvage.
godmode.event.cyber_attack=Panne Numérique Mondiale & Blackout Réseau
godmode.event.cyber_attack.desc=💻 Attaque informatique globale paralysant la division du travail, les banques et les chaînes logistiques.
godmode.event.earthquake=Séisme Tectonique Majeur
godmode.event.earthquake.desc=🏚️ Tremblement de terre dévastateur détruisant le capital bâti et perturbant l'économie régionale.
godmode.event.economic_crash=Krach Boursier & Crise Systémique
godmode.event.economic_crash.desc=📉 Crise financière systémique majeure amplifiant l'inégalité de Gini et le stress fiscal des États.
godmode.event.famine=Sécheresse & Famine Majeure
godmode.event.famine.desc=🌾 Effondrement des rendements agricoles et dégradation N-P-K des sols déclenchant une crise alimentaire.
godmode.event.geoengineering=Injection Stratosphérique d'Aérosols (SRM)
godmode.event.geoengineering.desc=🌍 Intervention délibérée d'ingénierie solaire injectant des aérosols pour contrer le réchauffement global.
godmode.event.heatwave=Canicule Extrême & Forçage Radiatif
godmode.event.heatwave.desc=☀️ Vague de chaleur extrême élevant les températures régionales, le stress hydrique et la mortalité wet-bulb.
godmode.event.ice_age=Glaciation Abrupte (Younger Dryas)
godmode.event.ice_age.desc=❄️ Refroidissement brutal du climat planétaire réduisant les terres arables et les récoltes.
godmode.event.meteor=Impact d'Astéroïde / Météore Majeur
godmode.event.meteor.desc=☄️ Collision météoritique injectant des poussières opaques, détruisant la biomasse et refroidissant la planète.
godmode.event.nuclear_strike=Échange / Frappe Nucléaire Majeure
godmode.event.nuclear_strike.desc=💥 Détonations nucléaires instantanées (intensité = nombre d'ogives/Mt) : souffle thermique létal, destruction des infrastructures locales, retombées radioactives et injection massive de suies stratosphériques.
godmode.event.nuclear_winter=Hiver Nucléaire & Suies Stratosphériques
godmode.event.nuclear_winter.desc=☢️ Incendies massifs et suies stratosphériques bloquant le rayonnement solaire pendant plusieurs décennies.
godmode.event.pandemic=Épidémie & Pandémie Zoonotique
godmode.event.pandemic.desc=🦠 Maladie infectieuse hautement contagieuse réduisant drastiquement la population et l'espérance de vie.
godmode.event.renaissance_boom=Révolution Industrielle & Scientifique
godmode.event.renaissance_boom.desc=🚀 Explosion d'innovations scientifiques accélérant le niveau technologique et la productivité du travail.
godmode.event.solar_emp=Tempête Solaire & IEM (Carrington)
godmode.event.solar_emp.desc=⚡ Éjection de masse coronale détruisant les réseaux électriques, la mémoire collective et la bande passante de Shannon.
godmode.event.tech_singularity=Émergence de la Superintelligence Artificielle
godmode.event.tech_singularity.desc=🤖 Singularité technologique multipliant exponentiellement le savoir scientifique et la puissance de calcul.
godmode.event.tsunami=Mégatsunami & Submersion Côtière
godmode.event.tsunami.desc=🌊 Vague géante dévastant les zones côtières, infrastructures portuaires et nœuds maritimes.
godmode.event.volcano=Éruption Stratosphérique de SO₂ (VEI-7+)
godmode.event.volcano.desc=🌋 Éruption volcanique majeure injectant du dioxyde de soufre dans la stratosphère, provoquant un refroidissement global temporaire.
