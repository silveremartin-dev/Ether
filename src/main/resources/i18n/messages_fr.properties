planet.preset=Préréglage Global
planet.preset.archipelago=Archipel
planet.preset.archipelago.desc=🏝️ MONDE ARCHIPEL : Monde océanique parsemé de micro-continents, chaînes d'îles et mers peu profondes. Rendement élevé du transport maritime, surfaces arables terrestres morcelées, forte dépendance commerciale halieutique.
planet.preset.biomes=🌿 Biomes du Preset
planet.preset.climate=🌡️ Climat du Preset
planet.preset.earth=Terre (Terran)
planet.preset.earth.desc=🌍 TERRE (2026 / Référence Moderne) : Planète tellurique de référence avec 70,8% d'océans, 15,0°C de température moyenne, 420 ppm de CO₂, 1,0 atm de pression atmosphérique et biosphère réelle calibrée par satellite.
planet.preset.earth_bronze=Terre (-1 900 / Âge du Bronze Moyen)
planet.preset.earth_bronze.desc=🏺 TERRE (-1 900 / Âge du Bronze Moyen) : Réseaux commerciaux transcontinentaux établis (cuivre, étain, ambre), codification des lois, cités-États hydrauliques et architecture monumentale de temple.
planet.preset.earth_eh=Terre (-10 000 / Holocène Précoce)
planet.preset.earth_eh.desc=🌾 TERRE (-10 000 / Holocène Précoce & Révolution Agricole) : Réchauffement post-glaciaire rapide, fonte des calottes continentales, récolte intensive de céréales sauvages au Croissant Fertile et premières domestications de plantes/animaux.
planet.preset.earth_iron=Terre (-1 000 / Début Âge du Fer)
planet.preset.earth_iron.desc=⚔️ TERRE (-1 000 / Début de l'Âge du Fer) : Démocratisation de la métallurgie du fer aux hauts fourneaux, déforestation accrue pour le charbon de bois, essor des grands empires classiques et monnaies frappées en Eurasie.
planet.preset.earth_lgm=Terre (-20 000 / Maximum Glaciaire)
planet.preset.earth_lgm.desc=❄️ TERRE (-20 000 / Pic du Dernier Maximum Glaciaire) : Anomalie thermique globale de -5°C à -6°C, calottes glaciaires de 3 km d'épaisseur sur l'Amérique du Nord et la Fennoscandie, niveau marin à -125m, vastes steppes-toundras à mammouths.
planet.preset.earth_lgm_onset=Terre (-25 000 / Début LGM & Béringie)
planet.preset.earth_lgm_onset.desc=🏔️ TERRE (-25 000 / Début du Maximum Glaciaire & Béringie) : Avancée glaciaire majeure. La baisse eustatique du niveau marin (-100m) découvre le pont continental de Béringie reliant la Sibérie et l'Alaska, facilitant le peuplement de l'Amérique.
planet.preset.earth_lh=Terre (-3 000 / Holocène Tardif)
planet.preset.earth_lh.desc=🏛️ TERRE (-3 000 / Holocène Tardif) : Stabilisation des littoraux maritimes modernes, aridification progressive du Sahara et émergence des grands empires hydrauliques agricoles du Nil, du Tigre-Euphrate, de l'Indus et du Fleuve Jaune.
planet.preset.earth_lig=Terre (-100 000 / Dernier Interglaciaire)
planet.preset.earth_lig.desc=🌍 TERRE (-100 000 / Dernier Interglaciaire / Éémien) : Climat interglaciaire chaud (+1 à +2°C au-dessus de l'ère préindustrielle), niveau marin à +6/+9m. Corridors sahéliens verts et premières expansions d'Homo Sapiens hors d'Afrique.
planet.preset.earth_mh=Terre (-6 000 / Sahara Vert)
planet.preset.earth_mh.desc=🌴 TERRE (-6 000 / Holocène Moyen & Sahara Vert) : Maximum thermique holocène et amplification de la mousson africaine. Le Sahara est une savane fertile dotée de mégalacs et de fleuves soutenant des sociétés pastorales prospères.
planet.preset.earth_mis3=Terre (-50 000 / Stade Isotopique 3 & Sahul)
planet.preset.earth_mis3.desc=🦘 TERRE (-50 000 / Stade Isotopique Marin MIS 3) : Climat glaciaire intermédiaire avec niveau marin à -60m découvrant les plateaux de Sunda et Sahul de part et d'autre de la ligne Wallace ; première navigation maritime océanique et peuplement de l'Australie.
planet.preset.earth_modern=Terre (2026 / Moderne)
planet.preset.earth_modern.desc=🌍 TERRE (2026 / Anthropocène Moderne) : Référence terrestre contemporaine avec 70,8% d'océans, 15,0°C de température moyenne, 420 ppm de CO₂, mondialisation industrielle et biomes calibrés par télédétection satellitaire.
planet.preset.eyeball=Monde Synchrone (Eyeball)
planet.preset.eyeball.desc=👁️ MONDE SYNCHRONE (Eyeball) : Rotation verrouillée par effet de marée autour d'une naine rouge. Face jour sous insolation brûlante perpétuelle, face nuit glacée permanente, et anneau tempéré habitable au terminateur.
planet.preset.heightmap=📷 Relief du Preset
planet.preset.hydro=💧 Hydrographie du Preset
planet.preset.ice=Monde Glaciaire (Boreas)
planet.preset.ice.desc=🧊 MONDE GLACIAIRE (Boreas) : Planète boule de neige en glaciation généralisée. Calottes de glace globales, océans cryogéniques sous banquise épaisse, albédo très élevé (0,65) et biomasse végétale restreinte.
planet.preset.mars=Mars (Ares)
planet.preset.mars.desc=🔴 MARS (Ares) : Monde désertique hyperaride à atmosphère ténue de CO₂ (0,006 atm), gigantesques volcans boucliers (Olympus Mons), grands canyons (Valles Marineris) et calottes polaires de glace carbonique.
planet.preset.moon=Lune (Selene)
planet.preset.moon.desc=⚪ LUNE (Selene) : Satellite tellurique sans atmosphère, cratères d'impacts, mers basaltiques riches en titane, hauts plateaux d'anorthosite, variations diurnes extrêmes (-170°C à +120°C) et hélium-3 piégé dans le régolithe.
planet.preset.rainfall=🌧️ Pluviométrie du Preset
planet.preset.resources=🪨 Ressources du Preset
planet.preset.seasonality=☀️ Saisons du Preset
planet.preset.super_earth=Super-Terre (Gaia Prime)
planet.preset.super_earth.desc=🪐 SUPER-TERRE (Gaia Prime) : Planète tellurique massive (1,5 rayon terrestre, 2,8 masses terrestres), gravité de surface 1,25g, atmosphère dense (2,2 atm) et vigoureux panaches convectifs mantelliques et volcaniques.
planet.preset.titan=Titan (Cryo-Lune)
planet.preset.titan.desc=🟠 TITAN (Cryo-Lune) : Lune cryogénique massive avec atmosphère dense d'azote et de méthane (1,5 atm, 94 K), lacs d'hydrocarbures liquides (méthane/éthane) et relief de glace d'eau rocheuse.
planet.preset.venus=Vénus (Hesperos)
planet.preset.venus.desc=🟡 VÉNUS (Hesperos) : Enfer à effet de serre emballé avec 92 atm de CO₂, température au sol de 465°C, nuages d'acide sulfurique, volcanisme basaltique actif et absence totale d'eau liquide de surface.
planet.preset.water=Monde Océan (Oceania)
planet.preset.water.desc=🌊 MONDE OCÉAN (Oceania) : Planète océanique panthalassique à 98% d'eau, absence de cratons continentaux émergés, écosystèmes pélagiques profonds et subsistance humaine exclusivement maritime.
