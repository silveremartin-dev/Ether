# --- ENGINE ---
engine.guide.btn_close=Fermer
engine.guide.btn_close.tooltip=Fermer ce guide de recommandations.
engine.guide.card1.body=La taille de cohorte définit le nombre moyen d'humains regroupés dans un même nœud agent au sein du buffer DOD vectorisé :\n• Minimum (1 à 30 personnes/cohorte) : Bandes paléolithiques nomades, clans de chasseurs-cueilleurs et micro-équipages d'avant-postes spatiaux. Fidélité maximale mais nombre d'agents élevé.\n• Recommandé par défaut (150 personnes/cohorte) : Nombre anthropologique de Dunbar. Modélise les villages néolithiques, tribus agraires et quartiers urbains. Équilibre parfait précision/vitesse.\n• Maximum / Macro (1 000 à 50 000 personnes/cohorte) : Métropoles antiques, empires médiévaux et macro-démographie industrielle pour maximiser le débit de simulation sur des populations gigantesques.
engine.guide.card1.title=👥 1. TAILLE DES COHORTES DÉMOGRAPHIQUES (DUNBAR & AGENTS DOD)
engine.guide.card2.body=La discrétisation spatiale H3 contrôle le maillage hexagonal global de la planète :\n• Résolution 2 (~1 100 km par cellule, ~4 100 cellules) : Simulations macro-historiques multi-millénaires ultra-rapides.\n• Résolution 3 (~420 km par cellule, ~28 000 cellules - Recommandé Planétaire) : Compromis idéal pour la Terre globale et les exoplanètes avec couplage tensoriel complet.\n• Résolution 4-5 (~160 km à ~60 km) : Idéal pour les scénarios continentaux et régionaux (Bassin Méditerranéen, Mésopotamie, Royaumes Combattants).\n• Résolution 6+ (≤ 20 km) : Micro-topographie haute définition. Nécessite une forte accélération CPU multi-cœur / GPU.
engine.guide.card2.title=🌐 2. RÉSOLUTION SPATIALE H3 (HEXAGONES PLANÉTAIRES)
engine.guide.card3.body=Le pas de temps Δt contrôle la fréquence d'actualisation des équations différentielles physiques et sociologiques :\n• 1 Jour / 1 Semaine (Pas Court) : Recommandé pour les flambées épidémiques aiguës (Peste Noire, Variole), mouvements militaires tactiques et chocs climatiques saisonniers.\n• 1 Mois (~30 jours - Standard Recommandé) : Base universelle d'Ether. Capture parfaitement les cycles agraires (semailles, moissons, crues du Nil), les températures saisonnières et la démographie avec un haut framerate.\n• 1 An (365 jours - Pas Long) : Recommandé pour les très longues campagnes (ex: Sortie d'Afrique -100 000 BP) pour traverser les millénaires en quelques minutes.
engine.guide.card3.title=⏱️ 3. RÉSOLUTION TEMPORELLE (PAS DE TEMPS Δt)
engine.guide.card4.body=• Histoire Profonde (-100k à 0) : H3 Res 2-3 | Pas : 1 mois ou 1 an | Cohorte : 30 à 150\n• Civilisations Antiques / Médiévales : H3 Res 3-4 | Pas : 1 mois | Cohorte : 150 à 500\n• Époque Moderne / Transition Énergétique : H3 Res 3 | Pas : 1 mois | Cohorte : 1 000 à 5 000\n• Épidémiologie / Chocs Aigus : H3 Res 4-5 | Pas : 1 jour ou 7 jours | Cohorte : 50 à 150
engine.guide.card4.title=🎯 4. PRÉRÉGLAGES RECOMMANDÉS PAR CAS D'USAGE
engine.guide.header_subtitle=Recommandations scientifiques et informatiques pour équilibrer le débit CPU/GPU et la fidélité historico-physique.
engine.guide.header_title=💡 GUIDE DE CONFIGURATION OPTIMALE DES MOTEURS ETHER
engine.guide.window_title=💡 Guide de recommandation des moteurs (Cohortes, H3 & Pas)

