# --- SNAPSHOT ---
snapshot.modal.btn_close=Fermer
snapshot.modal.btn_close.tooltip=Fermer cette boîte d'explications techniques.
snapshot.modal.card1.body=Un Snapshot (ou instantané d'état) est une capture intégrale, fidèle et déterministe de la planète et des sociétés à un tick ou une année T précise.\nIl fige l'intégralité des lois de conservation sans aucune approximation ni perte de précision.
snapshot.modal.card1.title=💡 1. DÉFINITION & NATURE D'UN SNAPSHOT
snapshot.modal.card2.body=• États Cellulaires H3 : Biomasse humaine, stocks alimentaires, eau disponible, nutriments du sol (NPK), capital physique (K₀), énergie (E₀), savoirs (I₀) et niveau technologique.\n• Registres DOD & Tenseurs : Buffers vectorisés des cohortes d'agents, tranches d'âges, pyramides démographiques et flux migratoires.\n• Climat & Temps : Année calendaire, mois, saison, forçage radiatif et bilan carbone.\n• Entités Sociopolitiques : Frontières territoriales, matrice d'affinité culturelle et journal des événements.
snapshot.modal.card2.title=🪐 2. VARIABLES & REGISTRES CAPTURÉS
snapshot.modal.card3.body=• Rolling Checkpoint Asynchrone : Le moteur persiste automatiquement un checkpoint léger sur disque tous les 60 ticks sans jamais figer l'interface utilisateur.\n• Restauration Instantanée (Warm-Start) : Charger un snapshot réinjecte directement les structures de données en mémoire vive, évitant d'avoir à recalculer des millénaires ou des siècles écoulés.
snapshot.modal.card3.title=⚡ 3. CHECKPOINTS EN TÂCHE DE FOND & RESTAURATION INSTANTANÉE
snapshot.modal.card4.body=Vous pouvez charger un snapshot à une année charnière (ex : 2040), modifier les paramètres d'infrastructure, les lois physiques ou injecter une crise (ex : rupture technologique, volcanisme), et observer la divergence de la civilisation par rapport à la session initiale.
snapshot.modal.card4.title=🔀 4. MULTIVERS & EMBRANCHEMENTS DE TRAJECTOIRES (BRANCHING)
snapshot.modal.header_subtitle=Guide technique sur la persistance déterministe, les rolling checkpoints et les embranchements de trajectoires (Branching).
snapshot.modal.header_title=📸 QU'EST-CE QU'UN SNAPSHOT & COMMENT ÇA FONCTIONNE ?
snapshot.modal.window_title=📸 Fonctionnement des Snapshots & Points de Restauration dans Ether

# --- SOURCE ---
source.biome.earth.desc=📡 SOURCE : Couvert Végétal & Biomes MODIS MCD12Q1 de la NASA\n🏛️ ORGANISATION : NASA EOSDIS & USGS Land Processes DAAC\n🔬 VARIABLES : 17 classes IGBP de biomes (forêts tropicales, savanes, prairies, taïga, toundra, déserts)\n📚 RÉFÉRENCE : Sulla-Menashe & Friedl (2018) User Guide to MODIS Land Cover.
source.climate.precip.earth.desc=📡 SOURCE : Projet Climatologique GPCP v2.3 & WorldClim v2.1 Bio12\n🏛️ ORGANISATION : NASA Goddard Space Flight Center & WorldClim\n🔬 VARIABLES : Précipitations moyennes annuelles (mm/an) et zones de convergence intertropicale\n📚 RÉFÉRENCE : Adler et al. (2018) Atmosphere, 9(4), 138.
source.climate.precip.mars.desc=📡 SOURCE : Modèle de Sublimation de Givre et Vapeur d'Eau Martienne\n🏛️ ORGANISATION : ESA Mars Express (OMEGA) & NASA MRO (CRISM)\n🔬 VARIABLES : Eau précipitable atmosphérique (pr-µm) et cycle saisonnier du givre polaire\n📚 RÉFÉRENCE : Smith (2004) Icarus, 167(1), 148-165.
source.climate.precip.mercury.desc=📡 SOURCE : Spectromètre Neutronique Exosphérique MESSENGER de la NASA\n🏛️ ORGANISATION : NASA & JHU/APL\n🔬 VARIABLES : Dépôts de glace d'eau protégés dans les cratères polaires du pôle nord\n📚 RÉFÉRENCE : Lawrence et al. (2013) Science, 339(6117), 292-296.
source.climate.precip.moon.desc=📡 SOURCE : Détecteur Neutronique LEND de NASA LRO (Hydrologie du Vide)\n🏛️ ORGANISATION : NASA & Institut de Recherche Spatiale Russe (IKI)\n🔬 VARIABLES : Hydrogène équivalent glace d'eau piégé dans les cratères polaires ombragés\n📚 RÉFÉRENCE : Mitrofanov et al. (2010) Science, 330(6003), 483-486.
source.climate.precip.venus.desc=📡 SOURCE : Modèle Virga H₂SO₄ et Dessiccation Vénusienne\n🏛️ ORGANISATION : ESA Venus Express & Pioneer Venus\n🔬 VARIABLES : Condensation de gouttelettes d'acide sulfurique, virgas mésosphériques et sécheresse au sol\n📚 RÉFÉRENCE : Titov et al. (2018) Space Science Reviews, 214(8), 126.
source.climate.precip.wms.desc=📡 SOURCE : Mesure Globale des Précipitations GPM IMERG (Satellite WMS)\n🏛️ ORGANISATION : NASA GSFC & JAXA\n🔬 VARIABLES : Taux de précipitations composites multisatellitaires (mm/h & mm/an)\n📚 RÉFÉRENCE : Huffman et al. (2019) NASA GPM IMERG Theoretical Document.
source.climate.season.earth.desc=📡 SOURCE : WorldClim v2.1 (Bio4 Saisonnalité Thermique) & ECMWF ERA5\n🏛️ ORGANISATION : Centre Européen pour les Prévisions Météorologiques & WorldClim\n🔬 VARIABLES : Écart-type de température annuelle (Bio4) et amplitude thermique été/hiver\n📚 RÉFÉRENCE : Fick & Hijmans (2017) International Journal of Climatology, 37(12), 4302-4315.
source.climate.season.mars.desc=📡 SOURCE : Modèle d'Insolation par Excentricité Orbitale & Obliquité Martienne\n🏛️ ORGANISATION : NASA JPL & LMD Paris\n🔬 VARIABLES : Modulation du flux solaire par l'excentricité (e=0,0934) et longitude solaire Ls\n📚 RÉFÉRENCE : Laskar et al. (2004) Icarus, 170(2), 343-364.
source.climate.season.mercury.desc=📡 SOURCE : Modèle Thermique de Résonance 3:2 & Excentricité de Mercure\n🏛️ ORGANISATION : NASA & JHU/APL\n🔬 VARIABLES : Résonance spin-orbite générant des longitudes chaudes et forts contrastes (e=0,2056)\n📚 RÉFÉRENCE : Margot et al. (2012) JGR Planets, 117(E00L09).
source.climate.season.moon.desc=📡 SOURCE : Modèle d'Amplitude Diurne Lunaire (Inclinaison 1,54°)\n🏛️ ORGANIZATION : NASA GSFC\n🔬 VARIABLES : Cycle jour/nuit de 29,5 jours terrestres créant un choc thermique de 300 K\n📚 RÉFÉRENCE : Vasavada et al. (2012) JGR Planets, 117(E00H18).
source.climate.season.venus.desc=📡 SOURCE : Modèle de Stabilité Thermique & Super-Rotation Vénusienne\n🏛️ ORGANISATION : JAXA Akatsuki & ESA Venus Express\n🔬 VARIABLES : Inclinaison axiale minime (3,39°) entraînant une quasi-absence de saisons au sol\n📚 RÉFÉRENCE : Sanchez-Lavega et al. (2017) Space Science Reviews, 212(3), 1541-1616.
source.climate.season.wms.desc=📡 SOURCE : Amplitude Thermique de Surface MODIS LST (Satellite WMS)\n🏛️ ORGANISATION : NASA Land Processes Distributed Active Archive Center (LP DAAC)\n🔬 VARIABLES : Amplitude thermique de surface jour/nuit sur le cycle annuel\n📚 RÉFÉRENCE : Wan et al. (2015) MODIS Land Surface Temperature User Guide.
source.climate.temp.earth.desc=📡 SOURCE : Réanalyse Atmosphérique ERA5 (ECMWF) & WorldClim v2.1 (Bio1)\n🏛️ ORGANISATION : Centre Européen pour les Prévisions Météorologiques (ECMWF) & NASA\n🔬 VARIABLES : Température annuelle moyenne à 2m (°C) et gradient thermique saisonnier\n🌐 RÉSOLUTION : Grille 0.1° (~11 km) rééchantillonnée en projection 2:1\n📚 RÉFÉRENCE : Hersbach et al. (2020) QJRMS; Fick & Hijmans (2017) Int. J. Climatol.
source.climate.temp.mars.desc=📡 SOURCE : Spectromètre Thermique TES (MGS) & Base MCD 6.1 (LMD/CNRS)\n🏛️ ORGANISATION : NASA JPL, ESA & Laboratoire de Météorologie Dynamique (CNRS/LMD)\n🔬 VARIABLES : Température radiative martienne, cycles diurnes et condensation du CO₂\n📚 RÉFÉRENCE : Forget et al. (1999) JGR Planets; Millour et al. (2023) MCD 6.1 Documentation.
source.climate.temp.mercury.desc=📡 SOURCE : Modèle Thermique Extrême & Résonance Spin-Orbite MESSENGER\n🏛️ ORGANISATION : NASA & Johns Hopkins Applied Physics Laboratory\n🔬 VARIABLES : Températures de résonance 3:2 (100 K à 700 K) et pièges froids polaires\n📚 RÉFÉRENCE : Vasavada et al. (1999) Icarus, 141(2), 179-193.
source.climate.temp.moon.desc=📡 SOURCE : Radiomètre Thermique Diviner de la sonde NASA LRO\n🏛️ ORGANISATION : NASA GSFC & UCLA Planetary Science\n🔬 VARIABLES : Températures diurnes extrêmes (40 K à 390 K) et pièges froids d'ombre permanente\n📚 RÉFÉRENCE : Paige et al. (2010) Science, 330(6003), 479-482.
source.climate.temp.venus.desc=📡 SOURCE : Spectrométrie VIRTIS (Venus Express) & Modèle Magellan\n🏛️ ORGANISATION : Agence Spatiale Européenne (ESA) & NASA JPL\n🔬 VARIABLES : Température de surface supercritique (465°C) et gradient altimétrique adiabatique\n📚 RÉFÉRENCE : Svedhem et al. (2007) Nature, 450, 637-641.
source.climate.temp.wms.desc=📡 SOURCE : Réanalyse Atmosphérique MERRA-2 de la NASA (Satellite WMS)\n🏛️ ORGANISATION : NASA Goddard Earth Sciences Data and Information Services Center\n🔬 VARIABLES : Température de surface 2D et flux d'équilibre radiatif global\n📚 RÉFÉRENCE : Gelaro et al. (2017) Journal of Climate, 30(14), 5419-5454.
source.demo.cshapes.desc=📡 SOURCE : CShapes 2.0 & Démographie Politique Historique Centennia\n🏛️ ORGANISATION : ETH Zürich & International Peace Research Institute Oslo (PRIO)\n🔬 VARIABLES : Capitales étatiques historiques, frontières géopolitiques et totaux de population régionale\n📚 RÉFÉRENCE : Schvitz et al. (2022) International Interactions, 48(1), 120-145.
source.demo.hyde.desc=📡 SOURCE : History Database of the Global Environment (HYDE 3.4)\n🏛️ ORGANISATION : PBL Netherlands Environmental Assessment Agency & Université d'Utrecht\n🔬 VARIABLES : Densité démographique historique, ratios urbain/rural, allocations de pâturages et cultures\n🌐 RÉSOLUTION : 5 arc-min (~8,5 km à l'équateur) en projection équirectangulaire 2:1\n📅 COUVERTURE : -10 000 BC à 2023 AD séries chronologiques historiques calibrées\n📚 RÉFÉRENCE : Klein Goldewijk et al. (2017) Earth System Science Data, 9(2), 927-953.
source.demo.paleo.desc=📡 SOURCE : Modèle Paléo-Démographique d'Expansion d'Homo Sapiens\n🏛️ ORGANISATION : Max Planck Institute for Evolutionary Anthropology & CalPal Database\n🔬 VARIABLES : Capacité d'accueil initiale des chasseurs-cueilleurs (hab/km²), corridors côtiers\n🌐 COUVERTURE : Grille spatiale multirésolution H3 calibrée sur le climat MIS 5 / MIS 4 (-100k à -50k BP)\n📚 RÉFÉRENCE : Tallavaara et al. (2015) PNAS; Henn et al. (2012) PLOS Genetics.
source.geo.aquifers.desc=📡 SOURCE : Cartographie Hydrogéologique Mondiale WHYMAP (UNESCO / BGR)\n🏛️ ORGANISATION : Programme Hydrologique International UNESCO & BGR Allemagne\n🔬 VARIABLES : Tenseur Géologique 9 — Nappes aquifères régionales continentales, réservoirs fossiles profonds et taux de recharge (km³)\n📚 RÉFÉRENCE : Margat & van der Gun (2013) UNESCO Groundwater Resources of the World; WHYMAP 2022.
source.geo.coal.desc=📡 SOURCE : Système de Données Minières USGS MRDS & Bassins Houillers BGR\n🏛️ ORGANISATION : United States Geological Survey & Institut Fédéral Allemand des Géosciences (BGR)\n🔬 VARIABLES : Tenseur Géologique 0 — Gisements de charbon bitumineux, anthracite et lignite (réserves en Gt)\n📚 RÉFÉRENCE : USGS MRDS Database (2023); BGR Energy Study Reserves (2022).
source.geo.gas.desc=📡 SOURCE : Évaluation Mondiale du Gaz USGS & Cartographie des Clathrates Océaniques\n🏛️ ORGANISATION : USGS & Agence Internationale de l'Énergie (AIE)\n🔬 VARIABLES : Tenseur Géologique 2 — Gisements de gaz naturel conventionnel, gaz de schiste et hydrates de méthane (Tcm)\n📚 RÉFÉRENCE : IEA World Energy Outlook (2023); Ruppel & Kessler (2017) Reviews of Geophysics.
source.geo.heat.desc=📡 SOURCE : Commission Internationale du Flux de Chaleur (IHFC / IUGG)\n🏛️ ORGANISATION : International Union of Geodesy and Geophysics (IUGG / IHFC)\n🔬 VARIABLES : Tenseur Géologique 8 — Flux thermique mantellique, conduction lithosphérique et gradients géothermiques (mW/m²)\n📚 RÉFÉRENCE : Davies (2013) Geochemistry Geophysics Geosystems, 14(10), 4608-4622.
source.geo.helium3.desc=📡 SOURCE : Spectromètre Gamma Lunar Prospector & Sondages Régolithe LRO NASA\n🏛️ ORGANISATION : NASA Planetary Data System & Lunar and Planetary Institute (LPI)\n🔬 VARIABLES : Tenseur Géologique 4 — Concentration en hélium-3 du vent solaire piégé dans l'ilménite lunaire (ppb)\n📚 RÉFÉRENCE : Schmitt (2006) Return to the Moon; Wittenberg et al. (1986) Fusion Technology.
source.geo.iron.desc=📡 SOURCE : Formations Ferrifères Rubanées (BIF) & Gisements Porphyriques USGS\n🏛️ ORGANISATION : United States Geological Survey (USGS Mineral Resources Program)\n🔬 VARIABLES : Tenseur Géologique 5 — Formations ferrifères rubanées précambriennes et complexes porphyriques de cuivre/nickel (Mt)\n📚 RÉFÉRENCE : Bekker et al. (2010) Economic Geology; Singer et al. (2008) USGS Report.
source.geo.oil.desc=📡 SOURCE : Évaluation Mondiale du Pétrole USGS WPA & Évaluation Pétrolière BGR\n🏛️ ORGANISATION : USGS Energy Resources Program & World Energy Council (WEC)\n🔬 VARIABLES : Tenseur Géologique 1 — Réserves conventionnelles et hydrocarbures liquides de roche-mère (Gbbl)\n📚 RÉFÉRENCE : USGS WPA Bulletin 2201; BGR Commodity Top 50.
source.geo.precious.desc=📡 SOURCE : Gisements de Métaux Précieux USGS (Or, Argent, Groupe du Platine)\n🏛️ ORGANISATION : USGS & World Gold Council (WGC)\n🔬 VARIABLES : Tenseur Géologique 6 — Filons de quartz orogéniques aurifères, argent épithermal et intrusions MGP du Bushveld (kt)\n📚 RÉFÉRENCE : USGS Mineral Commodity Summaries (2024); Goldfarb et al. (2001) Ore Geology Reviews.
source.geo.ree.desc=📡 SOURCE : Terres Rares USGS & Inventaire Mondial des Salars de Lithium\n🏛️ ORGANISATION : USGS Critical Minerals Review & Geoscience Australia\n🔬 VARIABLES : Tenseur Géologique 7 — Carbonatites (bastnäsite, monazite), salars de saumure de lithium et pegmatites à spodumène\n📚 RÉFÉRENCE : Bradley et al. (2017) USGS Lithium Review; Long et al. (2010) USGS REE Report.
source.geo.uranium.desc=📡 SOURCE : Base UDEPO de l'AIEA & Livre Rouge de l'OCDE/AEN\n🏛️ ORGANISATION : Agence Internationale de l'Énergie Atomique (AIEA) & Agence pour l'Énergie Nucléaire (OCDE/AEN)\n🔬 VARIABLES : Tenseur Géologique 3 — Teneurs en pechblende, filons uranifères hydrothermaux et thorium fissile (kt U)\n📚 RÉFÉRENCE : IAEA TECDOC-1843 UDEPO (2018); OECD/NEA Uranium Red Book (2022).
source.hydro.earth.desc=📡 SOURCE : Réseau Hydrographique USGS HydroSHEDS & SRTM SWBD\n🏛️ ORGANISATION : World Wildlife Fund (WWF) & USGS EROS Data Center\n🔬 VARIABLES : Réseau hydrographique continental, accumulation des flux de rivières et bassins lacustres\n📚 RÉFÉRENCE : Lehner, Verdin & Jarvis (2008) HydroSHEDS Documentation.
source.tensor.0.glottolog.desc=📡 SOURCE : Glottolog 4.8 & World Atlas of Language Structures (WALS)\n🏛️ ORGANISATION : Max Planck Institute for Evolutionary Anthropology (Leipzig)\n🔬 VARIABLES : Tenseur 0 — Classification des familles linguistiques (IDs 24-bit RGB) & gradient de distance dialectale\n🌐 COUVERTURE : 8 500+ langues et dialectes mondiaux documentés\n📚 RÉFÉRENCE : Hammarström, Forkel & Haspelmath (2023) Glottolog 4.8; Dryer & Haspelmath (2013).
source.tensor.1.murdock.desc=📡 SOURCE : Atlas Ethnographique de Murdock & Standard Cross-Cultural Sample (SCCS)\n🏛️ ORGANISATION : Université de Pittsburgh & Yale Human Relations Area Files (HRAF)\n🔬 VARIABLES : Tenseur 1 — Systèmes de parenté, règles de filiation (patrilinéaire, matrilinéaire, bilatérale) et exogamie\n🌐 ÉCHANTILLON : 1 167 sociétés traditionnelles et préindustrielles\n📚 RÉFÉRENCE : Murdock (1967) Ethnographic Atlas; Murdock & White (1969) SCCS.
source.tensor.2.seshat.desc=📡 SOURCE : Seshat Global History Databank & Projet Cliodynamique\n🏛️ ORGANISATION : Evolution Institute & Université d'Oxford (Cliodynamics Lab)\n🔬 VARIABLES : Tenseur 2 — Fréquence des rituels collectifs, dieux moraux et cohésion sacrée (Asabiyyah)\n🌐 COUVERTURE : 400+ sociétés historiques sur 5 000 ans d'histoire humaine\n📚 RÉFÉRENCE : Turchin et al. (2018) PNAS, 115(2), E144-E151; Whitehouse et al. (2019) Nature.
source.tensor.3.centennia.desc=📡 SOURCE : Atlas Historique Centennia & Domaines Géopolitiques CShapes\n🏛️ ORGANISATION : Clockwork Software & Université d'Essex\n🔬 VARIABLES : Tenseur 3 — Limites territoriales souveraines (IDs polities 24-bit), vassalité et marches frontières\n📅 PLAGE : -1000 BC à 2026 AD avec résolution temporelle décennale\n📚 RÉFÉRENCE : Reed (2014) Centennia Historical Atlas; CShapes 2.0 (2022).
source.tensor.4.archaeoglobe.desc=📡 SOURCE : ArchaeoGLOBE Global Land-Use & Technological Transitions Project\n🏛️ ORGANISATION : Consortium ArchaeoGLOBE & Université du Maryland\n🔬 VARIABLES : Tenseur 4 — Frontières technologiques matérielles (lithique, métallurgie bronze, fer de haut fourneau, vapeur)\n🌐 COUVERTURE : 255 régions archéologiques sur 10 000 ans de transition matérielle\n📚 RÉFÉRENCE : Stephens et al. (2019) Science, 365(6456), 897-902.
source.tensor.5.orbis.desc=📡 SOURCE : Réseau Géospatial de Transport Stanford ORBIS & Routes de la Soie\n🏛️ ORGANISATION : Université de Stanford & Programme UNESCO Routes de la Soie\n🔬 VARIABLES : Tenseur 5 — Réseaux commerciaux multimodaux, friction des distances de transport et carrefours de caravanes\n📚 RÉFÉRENCE : Scheidel & Meeks (2012) ORBIS Stanford; de La Vaissière (2005) Marchands sogdiens.
source.tensor.6.seshat_law.desc=📡 SOURCE : Complexité Institutionnelle Seshat & Cross-National Time-Series (CNTS)\n🏛️ ORGANISATION : Seshat Databank & Banks International Cross-Polity Survey\n🔬 VARIABLES : Tenseur 6 — Paliers de hiérarchie administrative, codification du droit écrit et bureaucratie fiscale\n📚 RÉFÉRENCE : Turchin, Currie, Turner et al. (2018) PNAS; Banks & Wilson (2020) CNTS.
source.tensor.7.anthromes.desc=📡 SOURCE : Biomes Anthropogéniques Anthromes 2.0 & Matrice de Stress HYDE 3.4\n🏛️ ORGANISATION : Université du Maryland & PBL Pays-Bas\n🔬 VARIABLES : Tenseur 7 — Empreinte environnementale humaine, déforestation, surpâturage et épuisement des sols\n📚 RÉFÉRENCE : Ellis & Ramankutty (2008) Frontiers in Ecology; Ellis et al. (2010) Global Ecology.
source.tensor.8.pathogens.desc=📡 SOURCE : Mémoire Épidémiologique Historique GADM & Indice Vectoriel OMS\n🏛️ ORGANISATION : Institute for Health Metrics and Evaluation (IHME) & Archives Historiques OMS\n🔬 VARIABLES : Tenseur 8 — Immunités acquises aux pathogènes, réservoirs zoonotiques et susceptibilité épidémique\n📚 RÉFÉRENCE : Dobson & Carper (1996); Hay et al. (2009) Global Malaria Distribution Atlas.
source.topo.earth.desc=📡 SOURCE : MNE Global NOAA ETOPO2022 & USGS GMTED2010\n🏛️ ORGANISATION : National Oceanic and Atmospheric Administration (NOAA) & USGS\n🔬 VARIABLES : Topographie continentale et bathymétrie océanique combinées (-11 000m à +8 848m)\n🌐 RÉSOLUTION : Grille matricielle 1 arc-minute calibrée au niveau zéro marin (0,478)\n📚 RÉFÉRENCE : NOAA NCEI (2022) ETOPO 2022 15 Arc-Second Global Relief Model.
source.topo.mars.desc=📡 SOURCE : MOLA Mars Global Surveyor & MNE Astrogeology USGS\n🏛️ ORGANISATION : NASA Jet Propulsion Laboratory & USGS Astrogeology Science Center\n🔬 VARIABLES : Altitude de surface martienne mesurée par rapport à l'aréocentre 6,1 mbar\n🌐 COUVERTURE : Mosaïque altimétrique laser globale à 100%\n📚 RÉFÉRENCE : Smith et al. (2001) Science, 292(5525), 2307-2316.
source.topo.mercury.desc=📡 SOURCE : MNE Altimètre MLA et Caméra MDIS de NASA MESSENGER\n🏛️ ORGANISATION : NASA & Johns Hopkins Applied Physics Laboratory (JHU/APL)\n🔬 VARIABLES : Élévation de surface, escarpements lobés et bassins d'impact polaires\n📚 RÉFÉRENCE : Zuber et al. (2012) Science, 336(6078), 217-220.
source.topo.moon.desc=📡 SOURCE : Altimétrie Laser LOLA de la sonde NASA LRO\n🏛️ ORGANISATION : NASA Goddard Space Flight Center & LPI\n🔬 VARIABLES : Topographie de surface, cratères d'impact et altitudes des mers de basalte\n📚 RÉFÉRENCE : Smith et al. (2010) Space Science Reviews, 150(1), 209-241.
source.topo.venus.desc=📡 SOURCE : Altimétrie Radar SAR Magellan de la NASA\n🏛️ ORGANISATION : NASA JPL & Agence Spatiale Européenne (Venus Express)\n🔬 VARIABLES : Altitude radar, réflectivité diélectrique et structures de coronae volcaniques\n📚 RÉFÉRENCE : Saunders et al. (1992) Journal of Geophysical Research, 97(E8), 13067.

