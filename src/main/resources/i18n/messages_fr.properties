variance.tooltip.cv=Coefficient de variation (Écart-type / Moyenne × 100). Hétérogénéité relative normalisée
variance.tooltip.gini=Mesure d'inégalité (0 = distribution parfaitement égale, 1 = concentration totale)
variance.tooltip.mean=Valeur moyenne (μ) standard observée sur la population
variance.tooltip.minmax=Valeurs extrêmes minimale et maximale enregistrées
variance.tooltip.stddev=Écart moyen par rapport au schéma standard (μ ± σ)
variance.tooltip.variance=Mesure de la dispersion quadratique (σ²) des individus par rapport à la moyenne
