# --- SNAPSHOT ---
snapshot.modal.btn_close=Fermer
snapshot.modal.btn_close.tooltip=Fermer cette bo├«te d'explications techniques.
snapshot.modal.card1.body=Un Snapshot (ou instantan├® d'├®tat) est une capture int├®grale, fid├¿le et d├®terministe de la plan├¿te et des soci├®t├®s ├á un tick ou une ann├®e T pr├®cise.\nIl fige l'int├®gralit├® des lois de conservation sans aucune approximation ni perte de pr├®cision.
snapshot.modal.card1.title=­ƒÆí 1. D├ëFINITION & NATURE D'UN SNAPSHOT
snapshot.modal.card2.body=ÔÇó ├ëtats Cellulaires H3 : Biomasse humaine, stocks alimentaires, eau disponible, nutriments du sol (NPK), capital physique (KÔéÇ), ├®nergie (EÔéÇ), savoirs (IÔéÇ) et niveau technologique.\nÔÇó Registres DOD & Tenseurs : Buffers vectoris├®s des cohortes d'agents, tranches d'├óges, pyramides d├®mographiques et flux migratoires.\nÔÇó Climat & Temps : Ann├®e calendaire, mois, saison, for├ºage radiatif et bilan carbone.\nÔÇó Entit├®s Sociopolitiques : Fronti├¿res territoriales, matrice d'affinit├® culturelle et journal des ├®v├®nements.
snapshot.modal.card2.title=­ƒ¬É 2. VARIABLES & REGISTRES CAPTUR├ëS
snapshot.modal.card3.body=ÔÇó Rolling Checkpoint Asynchrone : Le moteur persiste automatiquement un checkpoint l├®ger sur disque tous les 60 ticks sans jamais figer l'interface utilisateur.\nÔÇó Restauration Instantan├®e (Warm-Start) : Charger un snapshot r├®injecte directement les structures de donn├®es en m├®moire vive, ├®vitant d'avoir ├á recalculer des mill├®naires ou des si├¿cles ├®coul├®s.
snapshot.modal.card3.title=ÔÜí 3. CHECKPOINTS EN T├éCHE DE FOND & RESTAURATION INSTANTAN├ëE
snapshot.modal.card4.body=Vous pouvez charger un snapshot ├á une ann├®e charni├¿re (ex : 2040), modifier les param├¿tres d'infrastructure, les lois physiques ou injecter une crise (ex : rupture technologique, volcanisme), et observer la divergence de la civilisation par rapport ├á la session initiale.
snapshot.modal.card4.title=­ƒöÇ 4. MULTIVERS & EMBRANCHEMENTS DE TRAJECTOIRES (BRANCHING)
snapshot.modal.card5.body=• Aucune maintenance manuelle requise : Le sous-système de persistance gère les snapshots de manière 100% autonome, évitant à l'utilisateur tout nettoyage manuel.\n• Rétention logarithmique : Les pas de temps récents sont conservés à haute densité temporelle, tandis que les époques plus anciennes sont progressivement espacées selon des intervalles logarithmiques. Cela garantit une profondeur chronologique exhaustive sur plusieurs millénaires avec une empreinte mémoire et disque ultra-légère.
snapshot.modal.card5.title=🧹 5. GESTION AUTOMATIQUE & ÉLAGAGE LOGARITHMIQUE TEMPOREL
snapshot.modal.header_subtitle=Guide technique sur la persistance d├®terministe, les rolling checkpoints et les embranchements de trajectoires (Branching).
snapshot.modal.header_title=­ƒô© QU'EST-CE QU'UN SNAPSHOT & COMMENT ├çA FONCTIONNE ?
snapshot.modal.window_title=­ƒô© Fonctionnement des Snapshots & Points de Restauration dans Ether

