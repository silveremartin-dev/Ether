scenario.tooltip.sparse_cell_skipping=⚡ BÉNÉFICE : +40% à +60% de vitesse (TPS) sur la grille globale.\n⚠️ IMPACT PHYSIQUE : Interrompt les boucles d'évaluation sur les mailles désertiques/océaniques sans présence humaine ni événement actif.
