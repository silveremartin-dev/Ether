epoch.desc.antiquity=Empires classiques, intégration méditerranéenne, Pax Romana, commerce de la Route de la Soie.
epoch.desc.black_death=Pandémie de Yersinia pestis, choc démographique majeur, hausse des salaires réels paysans.
epoch.desc.bronze_age=Premières civilisations urbaines, métallurgie précoce, canaux d'irrigation, écriture.
epoch.desc.bronze_collapse=Effondrement systémique en Méditerranée orientale, Peuples de la Mer, rupture commerciale.
epoch.desc.columbian_exchange=Mondialisation océanique, transfert transatlantique de cultures vivrières et de pathogènes.
epoch.desc.great_acceleration=Exploitation massive des hydrocarbures, pompage des nappes profondes, boom démographique.
epoch.desc.green_sahara=Période humide africaine, lac Méga-Tchad, pastoralisme nomade à travers les savanes vertes.
epoch.desc.industrial_rev=Machine à vapeur, extraction charbonnière, transition démographique, régime énergétique fossile.
epoch.desc.iron_age=Généralisation de la sidérurgie, colonies commerciales phéniciennes et grecques en Méditerranée.
epoch.desc.late_antique_ice=Petit âge glaciaire de l'Antiquité tardive, famines, peste de Justinien, migrations nomades.
epoch.desc.lgm=Pic du LGM, niveau marin à -120m, steppe à mammouths, pont terrestre de la Béringie.
epoch.desc.medieval_optimum=Anomalie climatique médiévale, proto-industrialisation Song, réseaux marchands trans-eurasiens.
epoch.desc.mid_century=Stabilisation démographique, transition post-fossile, circularité des matières critiques.
epoch.desc.modern_baseline=Données satellitaires empiriques contemporaines, commerce globalisé, transition énergétique.
epoch.desc.neolithic=Début de l'agriculture dans le Croissant Fertile, domestication animale, premiers villages sédentaires.
epoch.desc.out_of_africa=Migration précoce de Sapiens à travers l'Ancien Monde, bandes de chasseurs-cueilleurs, mégafaune.
epoch.desc.sahul=Franchissement de la ligne Wallace, colonisation de l'Australie et extinctions mégafauniques.
epoch.desc.toba=Éruption du supervolcan Toba, hiver volcanique, goulet démographique et refuges côtiers.
epoch.desc.younger_dryas=Refroidissement abrupt de l'Hémisphère Nord, pression de fourrageage natoufien.
