scenario.density.desc.COASTAL_MARITIME=🌊 Focalisation Littorale & Maritime : Favorise la colonisation des littoraux, deltas et bordures côtières de la planète.
scenario.density.desc.EQUATORIAL_BELT=☀️ Bande Équatoriale : Colonisation prioritaire des latitudes équatoriales et des zones à fort rayonnement solaire.
scenario.density.desc.HIGHLAND_MOUNTAIN=🏔 Refuges Montagnards : Densification préférentielle sur les hautes vallées et plateaux d'altitude.
scenario.density.desc.INLAND_OASIS=🌴 Bassins Intérieurs & Oasis : Concentration autour des dépressions intérieures et nappes phréatiques accessibles.
scenario.density.desc.RANDOM=🎲 Distribution Stochastique : Attribution aléatoire uniforme de la population entre les cellules.
scenario.density.desc.RIVER_VALLEYS=🏞 Focalisation Fluviale & Alluviale : Concentration le long des réseaux hydrographiques et vallées fluviales principales.
scenario.density.desc.SPARSE_NOMADIC=⛺ Dispersion Nomade : Population pastorale dispersée à très faible densité sur l'ensemble des biomes viables.
scenario.density.desc.UNBIASED_NATURAL=⚖ Équilibre Bio-Climatique Naturel : Modèle physique pur. Aucun biais artificiel. La population s'établit strictement selon la viabilité environnementale réelle (biomes, température, cours d'eau, relief).
scenario.density.desc.UNIFORM=🟦 Distribution Homogène : Densité strictement constante sur toutes les cellules de la grille H3.
scenario.density.desc.URBAN_CLUSTERS=🏙 Métropoles & Grappes Urbaines : Émergence procédurale de plusieurs grands foyers d'agrégation à haute densité.
scenario.density_pattern=Modèle de Répartition :
