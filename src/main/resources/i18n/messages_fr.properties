scenario.tooltip.procedural_leaders=🌟 GESTION DES LEADERS ÉMERGENTS PROCÉDURAUX\n• Si activé : Des génies militaires, réformateurs ou bâtisseurs émergent stochastiquement selon la complexité et le stress des populations.\n• Si désactivé : Aucun leader procédural n'émerge.
scenario.tooltip.random_events=🎲 GESTION DES ÉVÉNEMENTS ALÉATOIRES & STOCHASTIQUES\n• Si activé : Le moteur génère des crises émergentes (famines, pestes, sécheresses, éruptions) pilotées par la graine stochastique (Seed).\n• Si désactivé : AUCUN événement aléatoire ne survient spontanément (trajectoire déterministe pure).
