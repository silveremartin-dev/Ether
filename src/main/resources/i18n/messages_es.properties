# --- SNAPSHOT ---
snapshot.modal.btn_close=Cerrar
snapshot.modal.btn_close.tooltip=Cerrar esta ventana explicativa.
snapshot.modal.card1.body=Una instant├ínea (o punto de control de estado) es una captura completa, bit a bit y determinista del planeta y la civilizaci├│n en un tick o a├▒o T espec├¡fico.\nCongela todas las leyes de conservaci├│n sin p├®rdida de precisi├│n.
snapshot.modal.card1.title=­ƒÆí 1. DEFINICI├ôN & NATURALEZA DE UN SNAPSHOT
snapshot.modal.card2.body=ÔÇó Estados celulares H3: Biomasa humana, reservas alimentarias, agua, nutrientes NPK, capital f├¡sico (KÔéÇ), energ├¡a (EÔéÇ), conocimiento (IÔéÇ) y tecnolog├¡a.\nÔÇó Registros DOD: B├║feres vectoriales de cohortes, pir├ímides demogr├íficas y flujos migratorios.\nÔÇó Clima y tiempo: A├▒o calendario, mes, forzamiento radiativo y balance de carbono.\nÔÇó Entidades sociopol├¡ticas: Fronteras, afinidades culturales y registro de eventos.
snapshot.modal.card2.title=­ƒ¬É 2. VARIABLES & REGISTROS CAPTURADOS
snapshot.modal.card3.body=ÔÇó Puntos de control as├¡ncronos: El motor guarda peri├│dicamente puntos de control ligeros en el disco cada 60 ticks sin bloquear la interfaz de usuario.\nÔÇó Restauraci├│n r├ípida: Cargar una instant├ínea restablece los datos directamente en la RAM, sin recalcular siglos pasados.
snapshot.modal.card3.title=ÔÜí 3. PUNTOS DE CONTROL EN SEGUNDO PLANO & RESTAURACI├ôN INSTANT├üNEA
snapshot.modal.card4.body=Puede bifurcar desde cualquier a├▒o hist├│rico clave (ej. 2040), ajustar par├ímetros f├¡sicos o inyectar crisis y observar c├│mo diverge la civilizaci├│n respecto a la sesi├│n inicial.
snapshot.modal.card4.title=­ƒöÇ 4. MULTIVERSO & BIFURCACI├ôN DE TRAYECTORIAS (BRANCHING)
snapshot.modal.card5.body=• Zero Manual Maintenance Required: The persistence subsystem manages snapshots 100% autonomously, sparing the user from manual file cleanup.\n• Logarithmic Time-Decay Retention: Recent simulation ticks are preserved at high temporal density, while older epochs are progressively thinned across logarithmic intervals. This ensures exhaustive multi-millennia chronological depth with a featherlight memory and disk footprint.
snapshot.modal.card5.title=🧹 5. AUTONOMOUS MANAGEMENT & LOGARITHMIC TIME-DECAY PRUNING
snapshot.modal.header_subtitle=Gu├¡a t├®cnica sobre persistencia determinista, puntos de control as├¡ncronos y bifurcaci├│n de trayectorias.
snapshot.modal.header_title=­ƒô© ┬┐QU├ë ES UN SNAPSHOT & C├ôMO FUNCIONA?
snapshot.modal.window_title=­ƒô© Funcionamiento de las Instant├íneas & Puntos de Restauraci├│n

