scenario.density.desc.INLAND_OASIS=🌴 Cuencas Interiores y Oasis: Concentración alrededor de depresiones endorreicas y acuíferos accesibles.
scenario.density.desc.RANDOM=🎲 Distribución Estocástica: Asignación aleatoria uniforme de población en celdas de tierra.
scenario.density.desc.RIVER_VALLEYS=🏞 Valles Fluviales y Cuencas Aluviales: Alta concentración de población a lo largo de las principales redes hidrográficas y cuencas aluviales.
scenario.density.desc.SPARSE_NOMADIC=⛺ Dispersión Nómada: Población pastoral dispersa a muy baja densidad en todos los biomas viables.
scenario.density.desc.UNBIASED_NATURAL=⚖ Equilibrio Bio-Climático Natural: Modelo físico puro. La población se establece estrictamente según la viabilidad ambiental real.
scenario.density.desc.UNIFORM=🟦 Distribución Homogénea: Densidad estrictamente constante en todas las celdas H3.
scenario.density.desc.URBAN_CLUSTERS=🏙 Emergencia de Metrópolis: Surgimiento procedimental de varios núcleos de agregación urbana de alta densidad.
